# .github/workflows/inference-bench.yml
#
# Reproducible Inference Benchmark — T81 ternary vs FP32/FP16/Int8/NEON
#
# Runs BM_InferenceComparison on every qualifying push to main and on release
# tags.  Parses JSON output and commits inference_comparison.md so results
# are always in sync with the code that produced them.
#
# Trigger:
#   - push to main (filter: benchmarks/BM_InferenceComparison.cpp or tensor headers)
#   - any v*.*.* release tag
#   - workflow_dispatch

name: Inference Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/BM_InferenceComparison.cpp'
      - 'include/t81/tensor/ternary_native.hpp'
      - 'include/t81/tensor.hpp'
      - 'src/tensor/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: inference-bench
  cancel-in-progress: true

jobs:
  inference-bench:
    name: Inference comparison · ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DT81_BUILD_BENCHMARKS=ON
          -DT81_BUILD_TESTS=OFF
          -DT81_BUILD_EXAMPLES=OFF
          -DT81_BUILD_FUZZ_TESTS=OFF
          -DCMAKE_CXX_FLAGS="-O3 -march=native -DNDEBUG"

      - name: Build benchmark runner
        run: cmake --build build --target benchmark_runner --parallel

      # Run each family separately to avoid the combined-run timeout that
      # occurs when Google Benchmark accumulates many Repetitions(2) suites.
      # Results are merged in the generate step.
      - name: Run DotProduct benchmarks
        run: |
          ./build/benchmarks/benchmark_runner \
            --benchmark_filter='^BM_DotProduct_' \
            --benchmark_min_time=0.05s \
            --benchmark_format=json \
            --benchmark_out=bench-DotProduct.json

      - name: Run MatMul benchmarks
        run: |
          ./build/benchmarks/benchmark_runner \
            --benchmark_filter='^BM_MatMul_' \
            --benchmark_min_time=0.05s \
            --benchmark_format=json \
            --benchmark_out=bench-MatMul.json

      - name: Run Attention benchmarks
        run: |
          ./build/benchmarks/benchmark_runner \
            --benchmark_filter='^BM_Attention_' \
            --benchmark_min_time=0.05s \
            --benchmark_format=json \
            --benchmark_out=bench-Attention.json

      - name: Run WeightLoad benchmarks
        run: |
          ./build/benchmarks/benchmark_runner \
            --benchmark_filter='^BM_WeightLoad_' \
            --benchmark_min_time=0.05s \
            --benchmark_format=json \
            --benchmark_out=bench-WeightLoad.json

      - name: Run TransformerLayer benchmarks
        run: |
          ./build/benchmarks/benchmark_runner \
            --benchmark_filter='^BM_TransformerLayer' \
            --benchmark_min_time=0.05s \
            --benchmark_format=json \
            --benchmark_out=bench-Transformer.json

      - name: Generate markdown results table
        run: |
          python3 - <<'PY'
          import json, math, datetime, subprocess
          from pathlib import Path

          # Merge all per-family JSON files
          benches = {}
          ctx = {}
          for f in Path(".").glob("bench-*.json"):
              try:
                  data = json.loads(f.read_text(encoding="utf-8"))
                  if not ctx:
                      ctx = data.get("context", {})
                  for b in data.get("benchmarks", []):
                      benches[b["name"]] = b
              except Exception:
                  pass

          date_str = datetime.date.today().isoformat()
          git_hash = ""
          try:
              git_hash = subprocess.check_output(
                  ["git", "rev-parse", "--short", "HEAD"], text=True
              ).strip()
          except Exception:
              pass

          def find(prefix):
              for sfx in ["_mean", "/repeats:2_mean", "/repeats:1_mean", "/repeats:2"]:
                  k = prefix + sfx
                  if k in benches: return benches[k]
              return benches.get(prefix, {})

          def ips(name, n):
              v = find(f"{name}/{n}").get("items_per_second", 0.0)
              return float(v) if v and math.isfinite(float(v)) and float(v) > 0 else None

          def ctr(name, n, field):
              return find(f"{name}/{n}").get(field)

          def fmt(v):
              if v is None: return "N/A"
              if v >= 1e9: return f"{v/1e9:.2f} Gops/s"
              if v >= 1e6: return f"{v/1e6:.2f} Mops/s"
              return f"{v:.0f} ops/s"

          def sp(t81, base):
              if not (t81 and base and base > 0): return "N/A"
              return f"**{t81/base:.2f}×**"

          def rat(a, b):
              try: return f"{float(a)/float(b):.2f}×"
              except: return "N/A"

          lines = [
              "# Inference Comparison Benchmark Results",
              "",
              f"**Generated:** {date_str}  ",
              f"**Commit:** `{git_hash}`  " if git_hash else "",
              f"**Runner:** {ctx.get('host_name', 'ubuntu-24.04')} · {ctx.get('num_cpus', '?')} CPUs @ {ctx.get('mhz_per_cpu', '?')} MHz  ",
              "**Build:** Release · `-O3 -march=native`",
              "",
              "> Throughput in weight-elements/second (higher is better).  ",
              "> T81 ternary: weights in {-1, 0, +1} — multiply replaced by conditional ADD/SUB or skip.  ",
              "> NEON: same compute pattern, 4-wide SIMD (AArch64). Int8: 8-bit weights, scalar MUL.",
              "",
              "## Dot Product",
              "",
              "| N | FP32 | FP16-sim | Int8 | T81 Scalar | T81 NEON | NEON vs FP32 | NEON vs Int8 |",
              "|---|------|----------|------|------------|----------|--------------|--------------|",
          ]
          for n in [64, 256, 1024, 4096, 16384]:
              fp32 = ips("BM_DotProduct_FP32", n)
              fp16 = ips("BM_DotProduct_FP16Sim", n)
              i8   = ips("BM_DotProduct_Int8", n)
              t81  = ips("BM_DotProduct_T81Ternary", n)
              neon = ips("BM_DotProduct_T81Ternary_NEON", n)
              lines.append(
                  f"| {n:,} | {fmt(fp32)} | {fmt(fp16)} | {fmt(i8)} | {fmt(t81)} | {fmt(neon)} "
                  f"| {sp(neon, fp32)} | {sp(neon, i8)} |"
              )

          lines += [
              "",
              "## Matrix Multiply (1×N · N×N → 1×N)",
              "",
              "| N | FP32 | FP16-sim | Int8 | T81 Scalar | T81 NEON | NEON vs FP32 | NEON vs Int8 |",
              "|---|------|----------|------|------------|----------|--------------|--------------|",
          ]
          for n in [64, 128, 256, 512]:
              fp32 = ips("BM_MatMul_FP32", n)
              fp16 = ips("BM_MatMul_FP16Sim", n)
              i8   = ips("BM_MatMul_Int8", n)
              t81  = ips("BM_MatMul_T81Ternary", n)
              neon = ips("BM_MatMul_T81Ternary_NEON", n)
              lines.append(
                  f"| {n} | {fmt(fp32)} | {fmt(fp16)} | {fmt(i8)} | {fmt(t81)} | {fmt(neon)} "
                  f"| {sp(neon, fp32)} | {sp(neon, i8)} |"
              )

          lines += [
              "",
              "## Scaled Dot-Product Attention (head_dim=64)",
              "",
              "| Seq len | FP32 | T81 Ternary | T81 vs FP32 |",
              "|---------|------|-------------|-------------|",
          ]
          for s in [32, 64, 128]:
              fp32 = ips("BM_Attention_FP32", s)
              t81  = ips("BM_Attention_T81Ternary", s)
              lines.append(f"| {s} | {fmt(fp32)} | {fmt(t81)} | {sp(t81, fp32)} |")

          lines += [
              "",
              "## Transformer Layer Forward Pass (dim=256, heads=4, mlp=512)",
              "",
              "| Seq len | FP32 (tok/s) | T81 Ternary (tok/s) | T81 vs FP32 |",
              "|---------|-------------|---------------------|-------------|",
          ]
          for s in [32, 64, 128]:
              fp32 = ips("BM_TransformerLayer_FP32", s)
              t81  = ips("BM_TransformerLayer_Ternary", s)
              lines.append(f"| {s} | {fmt(fp32)} | {fmt(t81)} | {sp(t81, fp32)} |")

          lines += [
              "",
              "## Weight Loading — Memory Efficiency",
              "",
              "| Weights | FP32 bytes | FP16 bytes | Int8 bytes | Ternary bytes | Ternary/FP32 |",
              "|---------|------------|------------|------------|---------------|--------------|",
          ]
          for n in [1024, 4096, 16384, 65536]:
              fp32b = ctr("BM_WeightLoad_FP32", n, "weight_bytes_fp32")
              fp16b = ctr("BM_WeightLoad_FP16Sim", n, "weight_bytes_fp16")
              t81b  = ctr("BM_WeightLoad_TernaryPacked", n, "weight_bytes_ternary")
              lines.append(
                  f"| {n:,} | {int(fp32b) if fp32b else n*4} | {int(fp16b) if fp16b else n*2} "
                  f"| {n} | {int(t81b) if t81b else (n+3)//4} "
                  f"| {rat(t81b if t81b else (n+3)//4, fp32b if fp32b else n*4)} |"
              )

          lines += [
              "",
              "## Key Takeaways",
              "",
              "- **NEON ternary dot product:** no-multiply 4-wide SIMD (vcgtq_f32 + vbslq_f32).",
              "  Beats scalar FP32 at large N once working set exceeds L1 cache.",
              "- **Int8** fills the quantization ladder between FP16 and ternary.",
              "  SDOT/SMULL autovectorization gives very high throughput at small N.",
              "- **Matmul:** FP32/int8 autovectorize to fused MACs; ternary NEON cmp+sel",
              "  still trails. Next step: tiled inner loop to keep output row in registers.",
              "- **Transformer layer:** end-to-end tokens/second through attention + SwiGLU MLP.",
              "  Ternary weight projections (Q,K,V,O,gate,up,down) — no float multiply.",
              "- **Memory:** ternary = 16× fewer bytes than FP32, 8× vs FP16, 4× vs Int8.",
              "  A 7B model: FP32=28 GB, FP16=14 GB, Int8=7 GB, Ternary=1.75 GB.",
              "",
              "## Methodology",
              "",
              "- **FP32:** `float` multiply-accumulate via inner loop.",
              "- **FP16-sim:** `uint16_t` weights promoted to `float` per element (no AVX-512 FP16 MACs).",
              "- **Int8:** `int8_t` weights, scalar MUL to `int32` accumulator. Compiler autovectorizes.",
              "- **T81 Ternary (scalar):** weights in {-1,0,+1}, branch to ADD/SUB/skip. No float multiply.",
              "- **T81 Ternary (NEON):** same compute pattern, 4 elements/cycle via `vcgtq_f32` + `vbslq_f32`.",
              "  No `vmulq_f32` — the ternary constraint eliminates all multiplies. AArch64 only.",
              "- All benchmarks compiled with `-O3 -march=native`, mean of 2 repetitions.",
              "- Results committed automatically by the `inference-bench` CI workflow.",
              "",
              "For the VM packed-trit dispatch path see `BM_NativeWeightsExecution.cpp`.",
          ]

          out = "\n".join(lines) + "\n"
          Path("benchmarks/results/inference_comparison.md").write_text(out, encoding="utf-8")
          print("wrote benchmarks/results/inference_comparison.md")
          PY

      - name: Upload raw JSON artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: inference-bench-json
          path: bench-*.json
          retention-days: 30

      - name: Commit results
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/inference_comparison.md
          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(bench): refresh inference comparison results [ci skip]"
            git push
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi
