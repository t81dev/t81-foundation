name: CanonFS portable storage mapping
on:
  push:
    branches: [fix/canonfs-portable-storage-mapping]
  workflow_dispatch:
  pull_request:
    paths:
      - 'fs/persistent_driver.cpp'
      - 'include/t81/canonfs/**'
      - 'experiments/canonfs_portability/**'
      - '.github/workflows/canonfs-portability.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - name: Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install ninja
      - name: Configure
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then export CC=gcc-14 CXX=g++-14; fi
          cmake -S . -B portable-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DT81_BUILD_CANONFS_PORTABILITY_AUDIT=ON -DT81_BUILD_TESTS=OFF \
            -DT81_BUILD_BENCHMARKS=OFF -DT81_BUILD_EXAMPLES=OFF -DT81_BUILD_TUI=OFF \
            -DT81_ENABLE_TERNARYOS=OFF 2>&1 | tee configure.log
      - name: Build
        run: cmake --build portable-build --target t81_canonfs_portability_probe t81_canonfs_portable_contract_test -j 4 2>&1 | tee build.log
      - name: Existing legacy regression contracts
        if: runner.os != 'Windows'
        run: |
          cmake --build portable-build --target t81_canonfs_legacy_persistent_driver t81_canonfs_legacy_read_verify t81_canonfs_legacy_read_verify_env_contract t81_canonfs_legacy_integrity_matrix t81_canonfs_legacy_identity_contract t81_canonfs_legacy_axion_trace -j 4 2>&1 | tee legacy-build.log
          for contract in persistent_driver read_verify read_verify_env_contract integrity_matrix identity_contract axion_trace; do
            ./portable-build/t81_canonfs_legacy_${contract} 2>&1 | tee "legacy-${contract}.log"
          done
      - name: Exact identity and compatibility contracts
        run: |
          ./portable-build/t81_canonfs_portable_contract_test contract-output 2>&1 | tee contract.log
          T81_CANONFS_READ_VERIFY=0 ./portable-build/t81_canonfs_portable_contract_test contract-diagnostics-output 2>&1 | tee contract-diagnostics.log
      - name: Reproduce original corpus and portable replacement
        if: always()
        run: python experiments/canonfs_portability/replay.py --probe portable-build/t81_canonfs_portability_probe --output replay-output 2>&1 | tee replay.log
      - name: Preserve raw native artifacts
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          with tarfile.open('canonfs-portability.tar.gz','w:gz') as out:
              for entry in [Path('replay-output'),Path('contract-output'),Path('contract-diagnostics-output'),*Path('.').glob('*.log')]:
                  if entry.exists(): out.add(entry,arcname=entry.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonfs-portability-${{ matrix.os }}
          path: canonfs-portability.tar.gz
          retention-days: 30
