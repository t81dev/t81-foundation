# T81 Foundation Release Workflow
#
# This workflow automates the release process. It triggers on the creation
# of a new tag matching the pattern "v*.*.*".
#
# The workflow performs the following steps:
# 1.  **Build Release Artifacts**: Compiles the code in Release mode and
#     creates a source code tarball.
# 2.  **Generate SBOM**: Creates a Software Bill of Materials (SBOM) for
#     the release artifacts.
# 3.  **Create GitHub Release**: Creates a new GitHub release and uploads
#     the release artifacts and SBOM.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Create Tarball
        run: tar -czf release.tar.gz -C build .

      - name: Generate SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          path: ./build/
          artifact-name: sbom.spdx.json

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: |
            release.tar.gz
            sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
