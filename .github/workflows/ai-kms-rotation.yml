name: AI KMS Key Rotation
on:
  schedule:
    - cron: '0 0 1 3,6,9,12 *' # First day of Mar, Jun, Sep, Dec
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rotate:
    name: " sec / rotate AI KMS keys "
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Perform rotation
        run: |
          python3 scripts/ci/rotate_ai_kms_keys.py \
            --keyring scripts/ci/ai_evidence_manifest_keyring.json \
            --keyring scripts/ci/ai_model_provenance_keyring.json \
            --keyring scripts/ci/ai_policy_ledger_keyring.json \
            --keyring scripts/ci/ai_backend_selection_keyring.json \
            --keyring scripts/ci/ai_governed_replay_keyring.json \
            --keyring scripts/ci/ai_direct_backend_attestation_keyring.json \
            --keyring scripts/ci/ai_benchmark_threshold_approval_keyring.json \
            --keyring scripts/ci/ai_quantization_profile_approval_keyring.json \
            --keyring scripts/ci/ai_opcode_baseline_approval_keyring.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@153407881c5c9595196166e017682181411a7049 # v6
        with:
          commit-message: "chore(sec): rotate AI KMS signing keyrings"
          title: "chore(sec): Routine AI KMS Keyring Rotation"
          body: |
            This PR automatically rotates the active and next KMS keys for all AI cryptographic keyrings, advancing the 120-day schema windows.

            **ACTION REQUIRED PRIOR TO MERGE**: 
            The infrastructure owner MUST generate new KMS-backed keys for the newly created `next` `material_env` targets and inject them into the CI secrets pane.
          branch: "chore/ai-kms-rotation"
          delete-branch: true
