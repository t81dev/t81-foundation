name: Cross-Platform Determinism Verification

# Produces a publicly-auditable record that T81 bytecode compilation and
# the full determinism test slice produce bit-identical outputs on both
# Linux x86_64 and macOS ARM64 GitHub-hosted runners.
#
# Evidence record: job summary on every run; artifact retained 90 days.
# Failure = hash divergence = critical determinism regression.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # daily at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build, hash, and test on each platform in parallel.
  # ──────────────────────────────────────────────────────────────────────────
  build-and-hash:
    name: "determinism / ${{ matrix.platform }}"
    strategy:
      fail-fast: false   # let both platforms run so we see both hashes on failure
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            cc: gcc-14
            cxx: g++-14

          - os: macos-latest
            platform: macos-arm64
            cc: clang
            cxx: clang++

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # ── Linux dependencies ──────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gcc-14 g++-14 python3

      # ── macOS dependencies ──────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      # ── Configure ───────────────────────────────────────────────────────
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DT81_BUILD_TESTS=ON

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --parallel

      # ── T81Lang bytecode reproducibility gate ────────────────────────────
      # Compiles each .t81 fixture twice and hashes all outputs into a single
      # aggregate SHA-256.  Two platforms with identical hashes = bit-exact
      # bytecode across architectures.
      - name: Run T81Lang repro gate
        run: |
          python3 scripts/ci/t81lang_repro_gate.py \
            --t81-bin build/t81 \
            --fixtures-dir tests/fixtures/t81lang_determinism \
            --workdir build/t81lang-repro \
            --hash-out build/t81lang-repro/hash.txt

      # ── Trace replay gate ────────────────────────────────────────────────
      # Compiles each fixture, runs the VM to capture a live execution trace,
      # then replays it against the checked-in golden trace.
      # Verifies that VM execution is bit-identical to the recorded sequence.
      - name: Run trace replay gate
        run: |
          python3 scripts/ci/trace_repro_gate.py \
            --t81-bin build/t81 \
            --fixtures-dir tests/fixtures/t81lang_determinism \
            --traces-dir   tests/fixtures/canonical_traces \
            --workdir      build/trace-repro \
            --hash-out     build/trace-repro/hash.txt

      # ── Determinism slice tests ──────────────────────────────────────────
      - name: Run determinism slice (ctest)
        run: |
          ctest --test-dir build --output-on-failure \
            -R '(jit|vm_|determinism|bigint|trace|canonical|repro|tritwise_backend_equivalence)'

      # ── Record platform metadata alongside hash ──────────────────────────
      - name: Annotate hash artifact
        run: |
          mkdir -p build/determinism-evidence
          BYTECODE_HASH=$(cat build/t81lang-repro/hash.txt | tr -d '[:space:]')
          TRACE_HASH=$(cat build/trace-repro/hash.txt | tr -d '[:space:]')
          printf '%s\n' \
            "platform=${{ matrix.platform }}" \
            "os=${{ matrix.os }}" \
            "cc=${{ matrix.cc }}" \
            "commit=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" \
            "bytecode_hash=${BYTECODE_HASH}" \
            "trace_hash=${TRACE_HASH}" \
            > build/determinism-evidence/metadata.txt
          cp build/t81lang-repro/hash.txt build/determinism-evidence/bytecode_hash.txt
          cp build/trace-repro/hash.txt   build/determinism-evidence/trace_hash.txt
          echo "BYTECODE_HASH=${BYTECODE_HASH}" >> "$GITHUB_ENV"
          echo "TRACE_HASH=${TRACE_HASH}" >> "$GITHUB_ENV"

      - name: Upload determinism evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: determinism-evidence-${{ matrix.platform }}
          path: build/determinism-evidence/
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # Cross-platform hash comparison.
  # Downloads both platform artifacts and diffs the hashes.
  # ──────────────────────────────────────────────────────────────────────────
  compare:
    name: "determinism / cross-platform compare"
    needs: build-and-hash
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download Linux evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: determinism-evidence-linux-x86_64
          path: evidence/linux-x86_64

      - name: Download macOS evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: determinism-evidence-macos-arm64
          path: evidence/macos-arm64

      - name: Compare hashes and publish summary
        run: |
          LINUX_BYTECODE=$(cat evidence/linux-x86_64/bytecode_hash.txt | tr -d '[:space:]')
          MACOS_BYTECODE=$(cat evidence/macos-arm64/bytecode_hash.txt   | tr -d '[:space:]')
          LINUX_TRACE=$(cat evidence/linux-x86_64/trace_hash.txt | tr -d '[:space:]')
          MACOS_TRACE=$(cat evidence/macos-arm64/trace_hash.txt   | tr -d '[:space:]')

          BYTECODE_MATCH=false
          TRACE_MATCH=false
          [ "${LINUX_BYTECODE}" = "${MACOS_BYTECODE}" ] && BYTECODE_MATCH=true
          [ "${LINUX_TRACE}"    = "${MACOS_TRACE}"    ] && TRACE_MATCH=true

          {
            echo "## Cross-Platform Determinism Report"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "### Bytecode Hash (T81Lang compiler output)"
            echo ""
            echo "| Platform | Hash |"
            echo "| :--- | :--- |"
            echo "| linux-x86_64 (ubuntu-24.04, gcc-14) | \`${LINUX_BYTECODE}\` |"
            echo "| macos-arm64  (macos-latest, clang)  | \`${MACOS_BYTECODE}\` |"
            echo ""
            if $BYTECODE_MATCH; then
              echo "✅ **PASS** — Bytecode is bit-identical across platforms."
            else
              echo "❌ **FAIL** — Bytecode diverges across platforms."
            fi
            echo ""
            echo "### Trace Hash (VM execution sequence)"
            echo ""
            echo "| Platform | Hash |"
            echo "| :--- | :--- |"
            echo "| linux-x86_64 (ubuntu-24.04, gcc-14) | \`${LINUX_TRACE}\` |"
            echo "| macos-arm64  (macos-latest, clang)  | \`${MACOS_TRACE}\` |"
            echo ""
            if $TRACE_MATCH; then
              echo "✅ **PASS** — VM execution trace is bit-identical across platforms."
            else
              echo "❌ **FAIL** — VM execution trace diverges across platforms."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if $BYTECODE_MATCH && $TRACE_MATCH; then
            echo "✅ PASS: bytecode and trace are bit-identical on linux-x86_64 and macos-arm64"
            echo "   bytecode: ${LINUX_BYTECODE}"
            echo "   trace:    ${LINUX_TRACE}"
          else
            echo "❌ FAIL: determinism regression detected"
            $BYTECODE_MATCH || echo "   bytecode divergence: linux=${LINUX_BYTECODE} macos=${MACOS_BYTECODE}"
            $TRACE_MATCH    || echo "   trace divergence:    linux=${LINUX_TRACE}    macos=${MACOS_TRACE}"
            exit 1
          fi

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: determinism-comparison-report
          path: evidence/
          retention-days: 90
