name: Cross-Platform Determinism Verification

# Produces a publicly-auditable record that T81 bytecode compilation and
# the full determinism test slice produce bit-identical outputs on both
# Linux x86_64 and macOS ARM64 GitHub-hosted runners.
#
# Evidence record: job summary on every run; artifact retained 90 days.
# Failure = hash divergence = critical determinism regression.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # daily at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build, hash, and test on each platform in parallel.
  # ──────────────────────────────────────────────────────────────────────────
  build-and-hash:
    name: "determinism / ${{ matrix.platform }}"
    strategy:
      fail-fast: false   # let both platforms run so we see both hashes on failure
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            cc: gcc-14
            cxx: g++-14

          - os: macos-latest
            platform: macos-arm64
            cc: clang
            cxx: clang++

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # ── Linux dependencies ──────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gcc-14 g++-14 python3

      # ── macOS dependencies ──────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      # ── Configure ───────────────────────────────────────────────────────
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DT81_BUILD_TESTS=ON

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --parallel

      # ── T81Lang bytecode reproducibility gate ────────────────────────────
      # Compiles each .t81 fixture twice and hashes all outputs into a single
      # aggregate SHA-256.  Two platforms with identical hashes = bit-exact
      # bytecode across architectures.
      - name: Run T81Lang repro gate
        run: |
          python3 scripts/ci/t81lang_repro_gate.py \
            --t81-bin build/t81 \
            --fixtures-dir tests/fixtures/t81lang_determinism \
            --workdir build/t81lang-repro \
            --hash-out build/t81lang-repro/hash.txt

      # ── Determinism slice tests ──────────────────────────────────────────
      - name: Run determinism slice (ctest)
        run: |
          ctest --test-dir build --output-on-failure \
            -R '(jit|vm_|determinism|bigint|trace|canonical|repro)'

      # ── Record platform metadata alongside hash ──────────────────────────
      - name: Annotate hash artifact
        run: |
          mkdir -p build/determinism-evidence
          HASH=$(cat build/t81lang-repro/hash.txt | tr -d '[:space:]')
          printf '%s\n' \
            "platform=${{ matrix.platform }}" \
            "os=${{ matrix.os }}" \
            "cc=${{ matrix.cc }}" \
            "commit=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" \
            "hash=${HASH}" \
            > build/determinism-evidence/metadata.txt
          cp build/t81lang-repro/hash.txt build/determinism-evidence/hash.txt
          echo "REPRO_HASH=${HASH}" >> "$GITHUB_ENV"

      - name: Upload determinism evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: determinism-evidence-${{ matrix.platform }}
          path: build/determinism-evidence/
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # Cross-platform hash comparison.
  # Downloads both platform artifacts and diffs the hashes.
  # ──────────────────────────────────────────────────────────────────────────
  compare:
    name: "determinism / cross-platform compare"
    needs: build-and-hash
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download Linux evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: determinism-evidence-linux-x86_64
          path: evidence/linux-x86_64

      - name: Download macOS evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: determinism-evidence-macos-arm64
          path: evidence/macos-arm64

      - name: Compare hashes and publish summary
        run: |
          LINUX_HASH=$(cat evidence/linux-x86_64/hash.txt | tr -d '[:space:]')
          MACOS_HASH=$(cat evidence/macos-arm64/hash.txt   | tr -d '[:space:]')

          echo "## Cross-Platform Determinism Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | T81Lang Bytecode Hash |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| linux-x86_64 (ubuntu-24.04, gcc-14) | \`${LINUX_HASH}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| macos-arm64  (macos-latest, clang)  | \`${MACOS_HASH}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${LINUX_HASH}" = "${MACOS_HASH}" ]; then
            echo "✅ **PASS** — Hashes match. Bytecode is bit-identical across linux-x86_64 and macos-arm64." >> "$GITHUB_STEP_SUMMARY"
            echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "✅ PASS: linux-x86_64 == macos-arm64"
            echo "   hash: ${LINUX_HASH}"
          else
            echo "❌ **FAIL — DETERMINISM REGRESSION DETECTED**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Hash divergence across platforms is a **critical defect** per the T81 determinism contract." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| | Hash |" >> "$GITHUB_STEP_SUMMARY"
            echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| linux-x86_64 | \`${LINUX_HASH}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| macos-arm64  | \`${MACOS_HASH}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "❌ FAIL: hash divergence detected"
            echo "   linux-x86_64 : ${LINUX_HASH}"
            echo "   macos-arm64  : ${MACOS_HASH}"
            exit 1
          fi

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: determinism-comparison-report
          path: evidence/
          retention-days: 90
