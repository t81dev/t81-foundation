name: runtime-contract

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:
    inputs:
      allow_contract_change:
        description: "Allow approved runtime-contract marker updates"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  contract-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout t81-foundation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: t81-foundation
          fetch-depth: 0

      - name: Checkout t81-vm
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: t81dev/t81-vm
          path: t81-vm
          ref: main
          fetch-depth: 0

      - name: Validate runtime boundary marker
        env:
          T81_VM_DIR: ${{ github.workspace }}/t81-vm
          T81_ENFORCE_CONTRACT_CHANGE_APPROVAL: "1"
        working-directory: t81-foundation
        run: |
          set -euo pipefail
          ALLOW_CHANGE=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_contract_change }}" = "true" ]; then
            ALLOW_CHANGE=1
          fi
          if [ -n "${{ github.base_ref }}" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="origin/main"
          fi
          T81_ALLOW_RUNTIME_CONTRACT_CHANGE="${ALLOW_CHANGE}" \
          T81_RUNTIME_CONTRACT_BASE_REF="${BASE_REF}" \
          python3 scripts/check-runtime-contract-sync.py
