name: PackedTritVector Regression Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark-regression:
    name: " benchmark-check / ubuntu-latest "
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build python3

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DT81_BUILD_BENCHMARKS=ON \
            -DT81_BUILD_TESTS=OFF \
            -DCMAKE_CXX_FLAGS="-mavx2 -mfma"

      - name: Build benchmark runner
        run: cmake --build build --target benchmark_runner --parallel

      - name: Run benchmarks
        run: |
          ./build/benchmarks/benchmark_runner \
            --benchmark_filter="BM_Kernel_T.*" \
            --benchmark_format=json \
            --benchmark_out=bench.json

      - name: Check for regression
        run: python3 scripts/ci/check_simd_regression.py bench.json
