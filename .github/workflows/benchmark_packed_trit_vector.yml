name: PackedTritVector Regression Check

on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-regression:
    name: " benchmark-check / ubuntu-latest "
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build python3

      - name: Configure CMake
        env:
          T81_BENCH_CXX_FLAGS: -mavx2 -mfma
        run: bash scripts/ci/build_benchmark_runner.sh

      - name: Run benchmarks
        run: |
          ./build/benchmarks/benchmark_runner \
            --benchmark_filter="BM_Kernel_T.*" \
            --benchmark_format=json \
            --benchmark_out=bench.json

      - name: Check for regression
        run: python3 scripts/ci/check_simd_regression.py bench.json
