# .github/workflows/qemu-boot.yml
#
# QEMU AArch64 Boot Capture — T81 / Axion
#
# Builds the slice6 EFI binary, assembles a FAT32 GPT disk image, boots it
# under QEMU (TCG cortex-a57 + EDK2 AArch64), captures serial output, and
# validates the expected boot sequence.  On success the sample boot log is
# committed back to main so drivers/qemu/sample-boot-log.txt stays current.
#
# Triggers:
#   - push to main (kernel, HAL, or driver changes)
#   - workflow_dispatch (manual)

name: QEMU Boot Capture

on:
  push:
    branches: [main]
    paths:
      - 'userland/experimental/**'
      - 'drivers/qemu/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qemu-boot
  cancel-in-progress: true

jobs:
  qemu-boot:
    name: Boot T81 on QEMU AArch64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      # ── Toolchain + QEMU ──────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 \
            qemu-system-arm qemu-efi-aarch64 ipxe-qemu \
            mtools parted \
            ninja-build cmake \
            python3

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DT81_ENABLE_TERNARYOS=ON \
            -DT81_BUILD_TESTS=OFF \
            -DT81_BUILD_EXAMPLES=OFF \
            -DT81_BUILD_BENCHMARKS=OFF \
            -DT81_BUILD_FUZZ_TESTS=OFF \
            -DT81_LLVM_CLANG=$(which clang-18) \
            -DT81_LLD_LINK=$(which lld-link-18)

      - name: Build EFI binary
        run: |
          cmake --build build --target t81_ternaryos_qemu_slice6_efi -j$(nproc)

      # ── Disk image ────────────────────────────────────────────────────────
      - name: Create FAT32 GPT disk image
        run: |
          EFI=build/ternaryos/qemu_slice6/BOOTAA64.EFI
          IMG=boot.img

          # 64 MiB raw image; partition table at sector 0, FAT32 at 1 MiB.
          dd if=/dev/zero of=$IMG bs=1M count=64 status=none
          parted -s $IMG mklabel gpt
          parted -s $IMG mkpart EFI fat32 1MiB 63MiB
          parted -s $IMG set 1 esp on

          # Populate FAT32 partition using mtools (no loop device / no root).
          # The @@offset syntax selects the byte offset of the partition.
          # Note: FAT32 is case-insensitive; copy only once as BOOTAA64.EFI
          # (the EDK2 default boot path for AArch64).
          OFFSET=1048576
          mformat -i "${IMG}@@${OFFSET}" -F -v SLICE6GUEST ::
          mmd    -i "${IMG}@@${OFFSET}" ::/EFI ::/EFI/BOOT ::/TERNOS
          mcopy  -i "${IMG}@@${OFFSET}" "$EFI" ::/EFI/BOOT/BOOTAA64.EFI

          COMMIT=$(git rev-parse --short HEAD)
          printf 'profile=qemu-armv8:AArch64/EDK2/slice6-boot-probe\ngit_commit=%s\n' "$COMMIT" > profile.txt
          mcopy  -i "${IMG}@@${OFFSET}" profile.txt ::/TERNOS/profile.txt

          echo "disk image: $(du -sh $IMG | cut -f1)"

      # ── CanonFS block store image ─────────────────────────────────────────
      - name: Create and format CanonFS raw block store image
        run: |
          # 4 MiB zero-filled raw disk — virtio-mmio slot 1 (0x0A000200).
          # VirtioBlkMmioDevice::kDefaultMmioBase targets this slot; slot 0
          # (0x0A000000) is the FAT32 boot disk loaded by OVMF.
          dd if=/dev/zero of=canon_store.img bs=1M count=4 status=none

          # Write a valid CanonFS superblock at byte offset 0.
          # Layout (729 bytes = one CanonBlock, matching CanonStore LBA 0):
          #   [0:4]   magic          "CST1"
          #   [4:8]   entry_count    0  (little-endian uint32)
          #   [8:688] entries        (17 × 40 B, all zero — no objects yet)
          #   [688:696] overflow_count  0  (little-endian uint64)
          #   [696:729] padding          (33 B, zero)
          python3 - <<'PYEOF'
          import struct, sys
          magic          = b'CST1'
          entry_count    = struct.pack('<I', 0)
          entries        = bytes(17 * 40)          # 680 bytes — no objects
          overflow_count = struct.pack('<Q', 0)
          padding        = bytes(33)
          superblock     = magic + entry_count + entries + overflow_count + padding
          assert len(superblock) == 729, f"superblock is {len(superblock)} bytes, expected 729"
          with open('canon_store.img', 'r+b') as f:
              f.write(superblock)
          print(f"CanonFS superblock written ({len(superblock)} bytes, magic=CST1, 0 entries)")
          PYEOF

          echo "canon store: $(du -sh canon_store.img | cut -f1)"

      - name: Verify CanonFS superblock
        run: |
          python3 - <<'PYEOF'
          import sys
          with open('canon_store.img', 'rb') as f:
              magic = f.read(4)
          if magic == b'CST1':
              print('PASS: CanonFS superblock CST1 magic verified')
          else:
              print(f'FAIL: expected CST1, got {magic!r}', file=sys.stderr)
              sys.exit(1)
          PYEOF

      # ── Phase 7: T81X process image at LBA 3 ─────────────────────────────
      # Assemble el0_process_stub.S into a flat binary with
      # --target=aarch64-unknown-elf (position-independent, no EFI headers),
      # then wrap it in a 64-byte T81X header and write the 512-byte sector
      # to LBA 3 (byte offset 1536) of canon_store.img.
      - name: Build and embed T81X process image
        run: |
          # Assemble the EL0 process stub to a raw ELF object.
          # -I: expose kernelcall_abi.inc for .include directives (RFC-00BD).
          clang-18 --target=aarch64-unknown-elf \
            -ffreestanding -nostdlib \
            -I userland/experimental/hal \
            -c \
            userland/experimental/hal/el0_process_stub.S \
            -o el0_process_stub.o

          # Link into an ELF executable at VA 0x0 (code runs from proc_code_page_pa).
          clang-18 --target=aarch64-unknown-elf \
            -ffreestanding -nostdlib \
            -Wl,-Ttext=0x0 -Wl,--omagic \
            el0_process_stub.o \
            -o el0_process_stub.elf

          # Extract raw .text section as a flat binary.
          llvm-objcopy-18 -O binary \
            --only-section=.text \
            el0_process_stub.elf \
            el0_process_stub.bin

          CODE_SIZE=$(wc -c < el0_process_stub.bin)
          echo "el0_process_stub.bin: ${CODE_SIZE} bytes"

          # Write T81X sector (512 bytes) to LBA 3 of canon_store.img.
          # T81X header layout (64 bytes):
          #   [0:4]   magic        "T81X"
          #   [4]     version      1
          #   [5:7]   reserved0    0
          #   [7:11]  entry_offset 0 (little-endian uint32)
          #   [11:15] code_size    N (little-endian uint32)
          #   [15:63] reserved     0
          #   [64:]   code section (raw bytes from el0_process_stub.bin)
          python3 - <<'PYEOF'
          import struct, sys

          with open('el0_process_stub.bin', 'rb') as f:
              code = f.read()

          assert len(code) <= 448, f"process stub too large: {len(code)} bytes (max 448)"

          hdr  = b'T81X'                      # magic [0:4]
          hdr += struct.pack('B', 1)           # version [4]
          hdr += b'\x00\x00'                   # reserved0 [5:7]
          hdr += struct.pack('<I', 0)          # entry_offset [7:11]
          hdr += struct.pack('<I', len(code))  # code_size [11:15]
          hdr += bytes(64 - len(hdr))          # pad header to 64 bytes [15:64]
          assert len(hdr) == 64, f"header is {len(hdr)} bytes, expected 64"

          sector = hdr + code
          sector += bytes(512 - len(sector))   # pad to one full sector
          assert len(sector) == 512

          LBA3_OFFSET = 3 * 512  # byte offset 1536
          with open('canon_store.img', 'r+b') as f:
              f.seek(LBA3_OFFSET)
              f.write(sector)

          print(f"T81X sector written at LBA3 (offset {LBA3_OFFSET}): "
                f"magic=T81X version=1 code_size={len(code)} bytes")
          PYEOF

          echo "canon store with T81X: $(du -sh canon_store.img | cut -f1)"

      - name: Verify T81X image at LBA 3
        run: |
          python3 - <<'PYEOF'
          import sys
          LBA3_OFFSET = 3 * 512
          with open('canon_store.img', 'rb') as f:
              f.seek(LBA3_OFFSET)
              magic   = f.read(4)
              version = int.from_bytes(f.read(1), 'little')
          if magic == b'T81X' and version == 1:
              print(f'PASS: T81X image at LBA3: magic=T81X version={version}')
          else:
              print(f'FAIL: expected T81X v1, got magic={magic!r} version={version}',
                    file=sys.stderr)
              sys.exit(1)
          PYEOF

      # ── Phase 8: IPC test images at LBA 4 (Process A) and LBA 5 (Process B) ─
      # Assemble el0_ipc_test_a.S and el0_ipc_test_b.S as flat T81X sectors
      # and write them to LBA 4 and LBA 5 of canon_store.img.
      - name: Build and embed Phase 8 IPC process images
        run: |
          for STUB in a b; do
            SRC="userland/experimental/hal/el0_ipc_test_${STUB}.S"
            OBJ="el0_ipc_test_${STUB}.o"
            ELF="el0_ipc_test_${STUB}.elf"
            BIN="el0_ipc_test_${STUB}.bin"

            # -I: expose kernelcall_abi.inc for .include directives (RFC-00BD).
            clang-18 --target=aarch64-unknown-elf \
              -ffreestanding -nostdlib \
              -I userland/experimental/hal \
              -c \
              "${SRC}" -o "${OBJ}"

            clang-18 --target=aarch64-unknown-elf \
              -ffreestanding -nostdlib \
              -Wl,-Ttext=0x0 -Wl,--omagic \
              "${OBJ}" -o "${ELF}"

            llvm-objcopy-18 -O binary \
              --only-section=.text \
              "${ELF}" "${BIN}"

            CODE_SIZE=$(wc -c < "${BIN}")
            echo "${BIN}: ${CODE_SIZE} bytes"
          done

          # Wrap each binary in a T81X header and write to canon_store.img.
          python3 - <<'PYEOF'
          import struct, sys

          def write_t81x(bin_path, lba, img_path='canon_store.img'):
              with open(bin_path, 'rb') as f:
                  code = f.read()
              assert len(code) <= 448, f"{bin_path} too large: {len(code)} bytes (max 448)"
              hdr  = b'T81X'
              hdr += struct.pack('B', 1)
              hdr += b'\x00\x00'
              hdr += struct.pack('<I', 0)
              hdr += struct.pack('<I', len(code))
              hdr += bytes(64 - len(hdr))
              assert len(hdr) == 64
              sector = hdr + code
              sector += bytes(512 - len(sector))
              assert len(sector) == 512
              offset = lba * 512
              with open(img_path, 'r+b') as f:
                  f.seek(offset)
                  f.write(sector)
              print(f"T81X sector written at LBA{lba} (offset {offset}): "
                    f"magic=T81X version=1 code_size={len(code)} bytes ({bin_path})")

          write_t81x('el0_ipc_test_a.bin', 4)
          write_t81x('el0_ipc_test_b.bin', 5)
          PYEOF

          echo "canon store with IPC images: $(du -sh canon_store.img | cut -f1)"

      # ── Phase 9: cooperative scheduler test images at LBA 6 (A) and LBA 7 (B)
      # el0_sched_test_a.S = Process A (sender, code-page offset 256).
      # el0_sched_test_b.S = Process B (blocker, code-page offset 0).
      # Both use .include "kernelcall_abi.inc" (RFC-00BD R4 mandate).
      - name: Build and embed Phase 9 scheduler test images
        run: |
          for STUB in a b; do
            SRC="userland/experimental/hal/el0_sched_test_${STUB}.S"
            OBJ="el0_sched_test_${STUB}.o"
            ELF="el0_sched_test_${STUB}.elf"
            BIN="el0_sched_test_${STUB}.bin"

            clang-18 --target=aarch64-unknown-elf \
              -ffreestanding -nostdlib \
              -I userland/experimental/hal \
              -c \
              "${SRC}" -o "${OBJ}"

            clang-18 --target=aarch64-unknown-elf \
              -ffreestanding -nostdlib \
              -Wl,-Ttext=0x0 -Wl,--omagic \
              "${OBJ}" -o "${ELF}"

            llvm-objcopy-18 -O binary \
              --only-section=.text \
              "${ELF}" "${BIN}"

            CODE_SIZE=$(wc -c < "${BIN}")
            echo "${BIN}: ${CODE_SIZE} bytes"
          done

          # Wrap each binary in a T81X header and write to canon_store.img.
          # Process A → LBA 6, Process B → LBA 7.
          python3 - <<'PYEOF'
          import struct

          def write_t81x(bin_path, lba, img_path='canon_store.img'):
              with open(bin_path, 'rb') as f:
                  code = f.read()
              assert len(code) <= 448, f"{bin_path} too large: {len(code)} bytes (max 448)"
              hdr  = b'T81X'
              hdr += struct.pack('B', 1)
              hdr += b'\x00\x00'
              hdr += struct.pack('<I', 0)
              hdr += struct.pack('<I', len(code))
              hdr += bytes(64 - len(hdr))
              assert len(hdr) == 64
              sector = hdr + code
              sector += bytes(512 - len(sector))
              assert len(sector) == 512
              offset = lba * 512
              with open(img_path, 'r+b') as f:
                  f.seek(offset)
                  f.write(sector)
              print(f"T81X sector written at LBA{lba} (offset {offset}): "
                    f"magic=T81X version=1 code_size={len(code)} bytes ({bin_path})")

          write_t81x('el0_sched_test_a.bin', 6)
          write_t81x('el0_sched_test_b.bin', 7)
          PYEOF

          echo "canon store with sched images: $(du -sh canon_store.img | cut -f1)"

      # ── Phase 11: T81X v2 identity test image at LBA 8 (RFC-00C0) ─────────
      # el0_wait_test.S = Process C (tid=4): calls WaitForDevice, gets woken by
      # EL1 via fs_sched_wake_device, then calls ExitThread.
      # Embedded as T81X v2 with FNV-1a-64 code_hash in header[19:27].
      - name: Build and embed Phase 11 identity test image
        run: |
          clang-18 --target=aarch64-unknown-elf \
            -ffreestanding -nostdlib \
            -I userland/experimental/hal \
            -c \
            userland/experimental/hal/el0_wait_test.S \
            -o el0_wait_test.o

          clang-18 --target=aarch64-unknown-elf \
            -ffreestanding -nostdlib \
            -Wl,-Ttext=0x0 -Wl,--omagic \
            el0_wait_test.o -o el0_wait_test.elf

          llvm-objcopy-18 -O binary \
            --only-section=.text \
            el0_wait_test.elf el0_wait_test.bin

          CODE_SIZE=$(wc -c < el0_wait_test.bin)
          echo "el0_wait_test.bin: ${CODE_SIZE} bytes"

          # Wrap as T81X v2 with FNV-1a-64 code_hash and write to LBA 8.
          python3 - <<'PYEOF'
          import struct

          FNV_OFFSET = 14695981039346656037
          FNV_PRIME  = 1099511628211

          def fnv1a64(data):
              h = FNV_OFFSET
              for b in data:
                  h ^= b
                  h = (h * FNV_PRIME) & 0xFFFFFFFFFFFFFFFF
              return h

          def write_t81x_v2(bin_path, lba, img_path='canon_store.img'):
              with open(bin_path, 'rb') as f:
                  code = f.read()
              assert len(code) <= 448, f"{bin_path} too large: {len(code)} bytes (max 448)"
              code_hash = fnv1a64(code)
              hdr  = b'T81X'
              hdr += struct.pack('B', 2)           # version 2  [4]
              hdr += b'\x00\x00'                   # reserved0  [5:7]
              hdr += struct.pack('<I', 0)           # entry_offset [7:11]
              hdr += struct.pack('<I', len(code))   # code_size  [11:15]
              hdr += struct.pack('<I', 0)           # data_size  [15:19]
              hdr += struct.pack('<Q', code_hash)   # code_hash  [19:27]
              hdr += bytes(64 - len(hdr))           # pad to 64  [27:64]
              assert len(hdr) == 64
              sector = hdr + code
              sector += bytes(512 - len(sector))
              assert len(sector) == 512
              offset = lba * 512
              with open(img_path, 'r+b') as f:
                  f.seek(offset)
                  f.write(sector)
              print(f"T81X v2 sector written at LBA{lba} (offset {offset}): "
                    f"code_size={len(code)} bytes, code_hash=0x{code_hash:016x} ({bin_path})")

          write_t81x_v2('el0_wait_test.bin', 8)

          # ── Phase 12 (RFC-00C1): T81M manifest at LBA 9 ──────────────────────
          # Entry: {tid=4, kind=43 (WaitForDevice), peer_tid=0}.
          # code_hash is computed from el0_wait_test.bin (same hash as LBA 8 header).

          def write_t81m(bin_path, manifest_entries, lba, img_path='canon_store.img'):
              with open(bin_path, 'rb') as f:
                  code = f.read()
              code_hash = fnv1a64(code)
              entry_count = len(manifest_entries)
              assert entry_count <= 40, f"too many manifest entries: {entry_count}"
              hdr  = b'T81M'
              hdr += struct.pack('B', 1)            # version        [4]
              hdr += b'\x00\x00\x00'                # reserved0      [5:8]
              hdr += struct.pack('<Q', code_hash)   # code_hash      [8:16]
              hdr += struct.pack('B', entry_count)  # entry_count    [16]
              hdr += bytes(15)                      # reserved1      [17:32]
              assert len(hdr) == 32
              body = b''
              for (tid, kind, peer_tid) in manifest_entries:
                  body += struct.pack('<III', tid, kind, peer_tid)
              sector = hdr + body
              sector += bytes(512 - len(sector))
              assert len(sector) == 512
              offset = lba * 512
              with open(img_path, 'r+b') as f:
                  f.seek(offset)
                  f.write(sector)
              print(f"T81M manifest written at LBA{lba} (offset {offset}): "
                    f"code_hash=0x{code_hash:016x}, {entry_count} entries")

          write_t81m('el0_wait_test.bin', [(4, 43, 0)], lba=9)

          # ── Phase 13 (RFC-00C2): same stub at LBA 10, loaded as tid=5 ─────────
          # The binary is identical to el0_wait_test.bin (same code_hash).
          # No separate manifest needed for Phase 13 (obs verification is inline).
          write_t81x_v2('el0_wait_test.bin', 10)
          PYEOF

          echo "canon store with identity+manifest+irq-wake images: $(du -sh canon_store.img | cut -f1)"

      # ── RFC-00BD: KernelCall ABI ordinal freeze check ─────────────────────
      - name: Verify KernelCallKind ordinal freeze (RFC-00BD)
        run: python3 scripts/ci/check_kernelcall_abi_freeze.py .

      # ── Boot ──────────────────────────────────────────────────────────────
      - name: Boot QEMU and capture serial
        run: |
          echo "QEMU version: $(qemu-system-aarch64 --version | head -1)"
          cp /usr/share/AAVMF/AAVMF_VARS.fd /tmp/edk2-vars.fd

          # Run for up to 40 seconds; exit code 124 (timeout) is expected and
          # treated as success — the kernel event loop runs indefinitely.
          # Two virtio-mmio drives:
          #   slot 31 (0x0A003E00): FAT32 boot disk — first device added, highest slot.
          #   slot 30 (0x0A003C00): CanonFS raw block store — second device, next slot.
          # QEMU virt allocates virtio-mmio buses top-down (slot 31 first).
          # gic-version=3: force GICv3 (redistributor at 0x080A0000 is mapped).
          # force-legacy=off: force virtio-mmio modern transport (version 2)
          #   so the bare-metal bridge's virtio queue setup code works; by
          #   default ubuntu-24.04's QEMU uses legacy (version 1) transport.
          timeout 40 qemu-system-aarch64 \
            -machine virt,gic-version=3 \
            -cpu cortex-a57 \
            -m 512M \
            -nographic \
            -serial file:serial.log \
            -global virtio-mmio.force-legacy=off \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/AAVMF/AAVMF_CODE.fd \
            -drive if=pflash,format=raw,file=/tmp/edk2-vars.fd \
            -drive id=boot0,if=none,format=raw,file=boot.img \
            -device virtio-blk-device,drive=boot0 \
            -drive id=canon0,if=none,format=raw,file=canon_store.img \
            -device virtio-blk-device,drive=canon0 \
            || true

          echo "=== Captured serial output ==="
          cat serial.log || echo "(empty)"

      # ── Validate ──────────────────────────────────────────────────────────
      - name: Validate boot sequence
        run: |
          pass=0; fail=0
          check() {
            if grep -qF "$1" serial.log 2>/dev/null; then
              echo "PASS: $1"; pass=$((pass+1))
            else
              echo "FAIL: $1"; fail=$((fail+1))
            fi
          }
          # Phase 1 (EFI): ConOut banner from efi_main before ExitBootServices.
          check "Axion QEMU AArch64 EDK2 slice6"
          # Phase 2 (bare-metal C): PL011 writes from qemu_slice6_bare_kernel.c
          # after ExitBootServices — proves EL1 MMIO access works.
          check "[axion] bare-metal EL1 kernel entry"
          check "[axion] ExitBootServices complete"
          # Phase 3 (C++ bridge): T81 banner + shell from qemu_slice6_cpp_bridge.cpp
          # — proves freestanding C++ executes after the bare-metal handoff.
          check "T81  --  Ternary OS for AI"
          check "[axion] policy engine: ready"
          check "[axion] canonfs: mounted (persistent, virtio-blk)"
          check "[axion] canonfs: I/O probe OK"
          check "[axion] kernel thread tid=1: running"
          check "[axion] event loop: priority dispatch"
          check "[axion] hw timer: GICv3 PPI30 armed (10ms)"
          # Phase 5 (MMU): controlled TTBR0 installed before ERET to EL0.
          check "[axion] el0: page-isolated (TTBR0 active, EL0 stack mapped)"
          # Phase 6 (KernelCall SVC bridge): axion_el0_entry uses SVC #1 KernelCall
          # (GetThreadIdentity wire request) then SVC #3 WriteSerial for banner.
          check "[axion] el0: init OK (tid=1)"
          check "[axion] el0: kernel call bridge OK (KernelCall SVC wired)"
          # Phase 7 (CanonFS process loading): canon_exec_load_and_run() reads
          # the T81X binary from LBA 3, copies it into the EL0 proc code page,
          # and ERets to el0_process_stub.S which emits this banner via SVC #3.
          check "[axion] el0: process loaded from CanonFS (tid=2)"
          # Phase 8 (EL0 IPC): canon_ipc_load_and_run() loads Process A (LBA 4,
          # tid=2) which calls SendMessage(tid=3), then Process B (LBA 5, tid=3)
          # which calls ReceiveMessage; EL1 confirms delivery and emits this gate.
          check "[axion] el0: IPC roundtrip OK (A->B, tid=2,3)"
          # Phase 9 (RFC-00BE): canon_sched_load_and_run() starts B (tid=3) which
          # calls BlockOnIpcReceive; scheduler ERets to A (tid=2) which calls
          # SendMessage(ipc_dst=3) waking B, then ExitThread; scheduler resumes B
          # which calls ExitThread; EL1 confirms delivery and emits this gate.
          check "[axion] el0: sched roundtrip OK (B blocked, A->B, tid=3<-2)"
          # Phase 10 (RFC-00BF): observability ring captured the expected Phase 9 call graph.
          check "[axion] el0: obs OK (BlockOnIpcReceive tid=3, SendMessage tid=2->3)"
          # Phase 11a (RFC-00C0): T81X v2 FNV-1a-64 code_hash validated before execute.
          check "[axion] el0: identity OK (hash=verified, tid=4)"
          # Phase 11b (RFC-00C0): WaitForDevice waker roundtrip confirmed via obs ring.
          check "[axion] el0: device wake OK (WaitForDevice tid=4)"
          # Phase 12 (RFC-00C1): T81M manifest loaded from LBA 9; code_hash matches
          # binary; obs ring contains all expected manifest entries (1/1).
          check "[axion] el0: manifest OK (code_hash=verified, seq=1/1 matched)"
          # Phase 13a (RFC-00C2): T81X v2 hash verified for IRQ-wake binary (tid=5).
          check "[axion] el0: irq identity OK (hash=verified, tid=5)"
          # Phase 13b (RFC-00C2): timer IRQ woke BlockedDeviceWait tid=5 via
          # fs_sched_timer_device_wake() + fs_sched_device_wait_loop wfi idle.
          check "[axion] el0: irq wake OK (WaitForDevice tid=5, timer-driven)"
          # Phase 14 (RFC-00C3): governance audit ring confirmed both async
          # events for tid=5 — kGovTimerDeviceWake + kGovAsyncContextSwitch.
          # Closes OQ-5: Axion audit trail now covers IRQ-driven context switches.
          check "[axion] el0: async audit OK (AsyncWake tid=5, irq-driven)"
          check "[axion] t81sh: ready (principal=axion, tier=1)"
          echo "$pass passed, $fail failed"
          [ "$fail" -eq 0 ]

      # ── Update sample boot log ────────────────────────────────────────────
      - name: Update sample-boot-log.txt
        run: |
          DATE=$(date -u +%Y-%m-%d)
          COMMIT=$(git rev-parse --short HEAD)
          {
            echo "# T81 / Axion — QEMU AArch64 Sample Boot Log"
            echo "# Platform: ubuntu-24.04, QEMU qemu-system-aarch64 (cortex-a57), EDK2 AArch64"
            echo "# Date: $DATE"
            echo "# Commit: $COMMIT"
            echo "# Generated automatically by .github/workflows/qemu-boot.yml"
            echo "#"
            cat serial.log
          } > drivers/qemu/sample-boot-log.txt

      - name: Commit updated boot log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drivers/qemu/sample-boot-log.txt
          if git diff --cached --quiet; then
            echo "boot log unchanged — no commit needed"
          else
            COMMIT=$(git rev-parse --short HEAD)
            git commit -m "ci(qemu): update serial boot log @ ${COMMIT} [ci skip]"
            # Push may be blocked by branch-protection required-checks; treat as advisory.
            git push || echo "Push skipped (branch protection — update log manually if needed)"
          fi

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: serial.log
          retention-days: 30
