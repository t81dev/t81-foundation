name: AI Experiments CI

on:
  push:
    branches: [ main, feature/ai-* ]
    paths:
      - 'experiments/ai/**'
      - 'CMakeLists.txt'
      - 'scripts/test_ai_simple.sh'
      - 'scripts/ci/check_ai_experiment_boundary.py'
      - 'scripts/ci/collect_ai_evidence_bundle.py'
      - 'scripts/ci/check_ai_model_provenance_gate.py'
      - 'scripts/ci/check_ai_policy_event_contract.py'
      - 'scripts/ci/check_ai_backend_adapter_contract.py'
      - 'scripts/ci/check_ai_opcode_subset_contract.py'
      - 'scripts/ci/check_ai_benchmark_spec_contract.py'
      - 'scripts/ci/check_ai_quantization_codec_contract.py'
      - 'scripts/ci/check_ai_ux_contract.py'
      - 'scripts/ci/generate_ai_opcode_runtime_report.py'
      - 'scripts/ci/check_ai_tloadhash_toolchain.py'
      - 'scripts/ci/run_governed_llama_flow.py'
      - '.github/workflows/ai-experiments-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'experiments/ai/**'
      - 'CMakeLists.txt'
      - 'scripts/test_ai_simple.sh'
      - 'scripts/ci/check_ai_experiment_boundary.py'
      - 'scripts/ci/collect_ai_evidence_bundle.py'
      - 'scripts/ci/check_ai_model_provenance_gate.py'
      - 'scripts/ci/check_ai_policy_event_contract.py'
      - 'scripts/ci/check_ai_backend_adapter_contract.py'
      - 'scripts/ci/check_ai_opcode_subset_contract.py'
      - 'scripts/ci/check_ai_benchmark_spec_contract.py'
      - 'scripts/ci/check_ai_quantization_codec_contract.py'
      - 'scripts/ci/check_ai_ux_contract.py'
      - 'scripts/ci/generate_ai_opcode_runtime_report.py'
      - 'scripts/ci/check_ai_tloadhash_toolchain.py'
      - 'scripts/ci/run_governed_llama_flow.py'
      - '.github/workflows/ai-experiments-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ai-experiments:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ninja-build
    
    - name: Configure AI Experiments
      run: |
        cmake -S . -B build -G Ninja -DT81_ENABLE_AI_EXPERIMENTS=ON
    
    - name: Build AI CLI
      id: build_ai
      run: |
        if cmake --build build --target help | grep -qE '(^| )t81_ai$'; then
          echo "has_target=true" >> "$GITHUB_OUTPUT"
          cmake --build build --target t81_ai
        else
          echo "has_target=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ target t81_ai is not defined in this configuration; skipping AI build."
          exit 0
        fi

    - name: Build RFC-0025 TLOADHASH conformance targets
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-rfc0025
        if cmake --build build --target help | grep -qE '(^| )t81_vm_tloadhash_conformance_test$'; then
          cmake --build build --target t81_vm_tloadhash_conformance_test
          cmake --build build --target t81_vm_tloadhash_decodefault_determinism_matrix_test
        else
          echo "❌ t81_vm_tloadhash_conformance_test target not found"
          exit 1
        fi

    - name: Run RFC-0025 TLOADHASH conformance tests
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        ctest --test-dir build --output-on-failure --verbose \
          -R 't81_vm_tloadhash_conformance_test|t81_vm_tloadhash_decodefault_determinism_matrix_test' \
          2>&1 | tee build/ai-rfc0025/tloadhash-ctest.log

    - name: Validate RFC-0025 canonize-tensor toolchain baseline
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-rfc0025
        python3 scripts/ci/check_ai_tloadhash_toolchain.py \
          --t81-bin build/t81 \
          --input-file tests/fixtures/llama_cpp_repro/model.gguf \
          --out-dir build/ai-rfc0025

    - name: Configure llama-enabled build (optional governed runtime evidence)
      if: vars.T81_ENABLE_LLAMA_REPRO == '1' && steps.build_ai.outputs.has_target == 'true' && hashFiles('tests/fixtures/llama_cpp_repro/model.gguf') != ''
      run: |
        cmake -S . -B build-llama-ai -G Ninja \
          -DT81_ENABLE_LLAMA_CPP=ON \
          -DT81_BUILD_TESTS=OFF \
          -DT81_BUILD_BENCHMARKS=OFF \
          -DT81_BUILD_FUZZ_TESTS=OFF
        cmake --build build-llama-ai --target t81 --parallel 2

    - name: Run governed llama flow evidence (optional)
      if: vars.T81_ENABLE_LLAMA_REPRO == '1' && steps.build_ai.outputs.has_target == 'true' && hashFiles('tests/fixtures/llama_cpp_repro/model.gguf') != ''
      run: |
        mkdir -p build/ai-governed
        python3 scripts/ci/run_governed_llama_flow.py \
          --t81-bin build-llama-ai/t81 \
          --model tests/fixtures/llama_cpp_repro/model.gguf \
          --prompt "Deterministic governed inference check." \
          --out-dir build/ai-governed \
          --max-tokens 8 \
          --seed 0 \
          --threads 1 \
          --temperature 0 \
          --top-k 1 \
          --top-p 1.0

    - name: Verify Binary Exists
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        if [ ! -f "build/experiments/ai/ux_tools/t81_ai" ]; then
          echo "❌ AI CLI binary not found"
          exit 1
        fi
        echo "✅ AI CLI binary found"
    
    - name: Run Smoke Tests
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        # Test help command
        ./build/experiments/ai/ux_tools/t81_ai --help
        
        # Test model inspection
        echo "mock model data" > test_model.gguf
        ./build/experiments/ai/ux_tools/t81_ai model inspect test_model.gguf
        
        # Test model verification
        ./build/experiments/ai/ux_tools/t81_ai verify test_model.gguf
        
        # Test error handling
        ! ./build/experiments/ai/ux_tools/t81_ai verify nonexistent.gguf || true
        
        echo "✅ All AI CLI smoke tests passed"
    
    - name: Enforce AI sandbox boundary
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin ${{ github.base_ref }} --depth=1
          python3 scripts/ci/check_ai_experiment_boundary.py --check-pr-diff
        else
          python3 scripts/ci/check_ai_experiment_boundary.py
        fi
    
    - name: Run Official Smoke Test
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        ./scripts/test_ai_simple.sh

    - name: Collect AI deterministic evidence bundle (RFC-00A1 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-evidence
        python3 scripts/ci/collect_ai_evidence_bundle.py \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --out-dir build/ai-evidence \
          --runs 3

    - name: Enforce model provenance hash gate (RFC-00A3 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-provenance
        python3 scripts/ci/check_ai_model_provenance_gate.py \
          --model build/ai-provenance/test_model.gguf \
          --manifest build/ai-provenance/test_model.manifest.json \
          --self-test-deny

    - name: Validate AI policy event contract (RFC-00A6 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-policy
        python3 scripts/ci/check_ai_policy_event_contract.py \
          --out-dir build/ai-policy

    - name: Validate backend adapter contract (RFC-00A5 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-backend
        python3 scripts/ci/check_ai_backend_adapter_contract.py \
          --out-dir build/ai-backend

    - name: Validate AI opcode subset contract (RFC-0026 / RFC-00A8 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-opcodes
        python3 scripts/ci/check_ai_opcode_subset_contract.py \
          --out-dir build/ai-opcodes

    - name: Run RFC-0026 phase-1 opcode fail-closed conformance
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-opcodes
        if cmake --build build --target help | grep -qE '(^| )t81_vm_ai_phase1_opcode_stub_conformance_test$'; then
          cmake --build build --target t81_vm_ai_phase1_opcode_stub_conformance_test
          ctest --test-dir build --output-on-failure --verbose \
            -R 't81_vm_ai_phase1_opcode_stub_conformance_test' \
            2>&1 | tee build/ai-opcodes/ai_phase1_opcode_ctest.log
        else
          echo "❌ t81_vm_ai_phase1_opcode_stub_conformance_test target not found"
          exit 1
        fi

    - name: Generate AI opcode runtime report (RFC-00A8 evidence)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-opcodes-runtime
        python3 scripts/ci/generate_ai_opcode_runtime_report.py \
          --repo-root . \
          --out-dir build/ai-opcodes-runtime

    - name: Validate AI benchmark spec contract (RFC-00A2 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-benchmark
        python3 scripts/ci/check_ai_benchmark_spec_contract.py \
          --out-dir build/ai-benchmark

    - name: Validate AI quantization codec contract (RFC-00A4 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-quantization
        python3 scripts/ci/check_ai_quantization_codec_contract.py \
          --out-dir build/ai-quantization

    - name: Validate AI UX contract (RFC-00A7 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-ux
        python3 scripts/ci/check_ai_ux_contract.py \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --out-dir build/ai-ux

    - name: Append AI evidence summary
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        cat build/ai-evidence/ai_evidence_summary.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-policy/ai_policy_event_contract.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-backend/ai_backend_adapter_contract.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-opcodes/ai_opcode_subset_contract.md >> "$GITHUB_STEP_SUMMARY"
        {
          echo "# RFC-0026 Phase-1 Opcode Conformance"
          echo ""
          echo "- ctest regex: \`t81_vm_ai_phase1_opcode_stub_conformance_test\`"
          echo "- log: \`build/ai-opcodes/ai_phase1_opcode_ctest.log\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-opcodes-runtime/ai_opcode_runtime_report.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-benchmark/ai_benchmark_spec_contract.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-quantization/ai_quantization_codec_contract.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-ux/ai_ux_contract.md >> "$GITHUB_STEP_SUMMARY"
        {
          echo "# RFC-0025 TLOADHASH Conformance"
          echo ""
          echo "- ctest regex: \`t81_vm_tloadhash_conformance_test|t81_vm_tloadhash_decodefault_determinism_matrix_test\`"
          echo "- log: \`build/ai-rfc0025/tloadhash-ctest.log\`"
          echo "- toolchain artifact: \`build/ai-rfc0025/ai_tloadhash_toolchain.json\`"
          echo "- governed runtime artifact (optional lane): \`build/ai-governed/governed_llama_flow.json\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-rfc0025/ai_tloadhash_toolchain.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload AI evidence artifacts
      if: steps.build_ai.outputs.has_target == 'true'
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ai-evidence-bundle
        path: |
          build/ai-evidence/ai_evidence_bundle.json
          build/ai-evidence/ai_evidence_bundle.sha256
          build/ai-evidence/ai_evidence_summary.md
          build/ai-provenance/test_model.manifest.json
          build/ai-policy/ai_policy_event_contract.json
          build/ai-policy/ai_policy_event_contract.md
          build/ai-backend/ai_backend_adapter_contract.json
          build/ai-backend/ai_backend_adapter_contract.md
          build/ai-opcodes/ai_opcode_subset_contract.json
          build/ai-opcodes/ai_opcode_subset_contract.md
          build/ai-opcodes/ai_phase1_opcode_ctest.log
          build/ai-opcodes-runtime/ai_opcode_runtime_report.json
          build/ai-opcodes-runtime/ai_opcode_runtime_report.md
          build/ai-benchmark/ai_benchmark_spec_contract.json
          build/ai-benchmark/ai_benchmark_spec_contract.md
          build/ai-quantization/ai_quantization_codec_contract.json
          build/ai-quantization/ai_quantization_codec_contract.md
          build/ai-ux/ai_ux_contract.json
          build/ai-ux/ai_ux_contract.md
          build/ai-ux/ai_workflow_replay.json
          build/ai-ux/ai_observability_trace.json
          build/ai-rfc0025/tloadhash-ctest.log
          build/ai-rfc0025/ai_tloadhash_toolchain.json
          build/ai-rfc0025/ai_tloadhash_toolchain.md
          build/ai-rfc0025/policy.apl
          build/ai-governed/governed_llama_flow.json
          build/ai-governed/canonize.stdout.log
          build/ai-governed/canonize.stderr.log
          build/ai-governed/llama_run.stdout.log
          build/ai-governed/llama_run.stderr.log
          build/ai-governed/policy.apl
