name: AI Experiments CI

on:
  push:
    branches: [ main, feature/ai-* ]
  pull_request:
    branches: [ main ]
    paths:
      - 'experiments/ai/**'
      - 'CMakeLists.txt'
      - 'scripts/test_ai_simple.sh'

jobs:
  test-ai-experiments:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ninja-build
    
    - name: Configure AI Experiments
      run: |
        cmake -S . -B build -G Ninja -DT81_ENABLE_AI_EXPERIMENTS=ON
    
    - name: Build AI CLI
      run: |
        cmake --build build --target t81_ai
    
    - name: Verify Binary Exists
      run: |
        if [ ! -f "build/experiments/ai/ux_tools/t81_ai" ]; then
          echo "❌ AI CLI binary not found"
          exit 1
        fi
        echo "✅ AI CLI binary found"
    
    - name: Run Smoke Tests
      run: |
        # Test help command
        ./build/experiments/ai/ux_tools/t81_ai --help
        
        # Test model inspection
        echo "mock model data" > test_model.gguf
        ./build/experiments/ai/ux_tools/t81_ai model inspect test_model.gguf
        
        # Test model verification
        ./build/experiments/ai/ux_tools/t81_ai verify test_model.gguf
        
        # Test error handling
        ! ./build/experiments/ai/ux_tools/t81_ai verify nonexistent.gguf || true
        
        echo "✅ All AI CLI smoke tests passed"
    
    - name: Verify Core Isolation
      run: |
        # Ensure no core directories were modified in this PR
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin ${{ github.base_ref }} --depth=1
          CORE_CHANGES=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }} | grep -E '^(src/|include/t81/|spec/|tests/)' || true)
          if [ -n "$CORE_CHANGES" ]; then
            echo "❌ Core directories were modified:"
            echo "$CORE_CHANGES"
            exit 1
          fi
        fi
        echo "✅ Core isolation verified"
    
    - name: Run Official Smoke Test
      run: |
        ./scripts/test_ai_simple.sh
