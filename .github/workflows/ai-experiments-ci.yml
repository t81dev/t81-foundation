name: AI Experiments CI

on:
  push:
    branches: [ main, feature/ai-* ]
    paths:
      - 'experiments/ai/**'
      - 'CMakeLists.txt'
      - 'scripts/test_ai_simple.sh'
      - 'scripts/ci/check_ai_experiment_boundary.py'
      - 'scripts/ci/collect_ai_evidence_bundle.py'
      - 'scripts/ci/check_ai_model_provenance_gate.py'
      - 'scripts/ci/ai_model_provenance_keyring.json'
      - 'scripts/ci/check_ai_policy_event_contract.py'
      - 'scripts/ci/ai_policy_ledger_keyring.json'
      - 'scripts/ci/check_ai_backend_adapter_contract.py'
      - 'scripts/ci/ai_backend_selection_keyring.json'
      - 'scripts/ci/check_ai_vm_trace_evidence.py'
      - 'scripts/ci/check_ai_opcode_subset_contract.py'
      - 'scripts/ci/check_ai_rfc0026_readiness.py'
      - 'scripts/ci/check_ai_opcode_baseline_history_approvals.py'
      - 'scripts/ci/ai_opcode_baseline_approval_keyring.json'
      - 'scripts/ci/check_ai_benchmark_spec_contract.py'
      - 'scripts/ci/check_ai_benchmark_capability_matrix.py'
      - 'scripts/ci/ai_benchmark_capability_expectations.json'
      - 'scripts/ci/check_ai_inference_capability_matrix.py'
      - 'scripts/ci/ai_inference_capability_expectations.json'
      - 'scripts/ci/check_ai_benchmark_threshold_approvals.py'
      - 'scripts/ci/ai_benchmark_threshold_approval_keyring.json'
      - 'scripts/ci/ai_benchmark_thresholds.json'
      - 'scripts/ci/ai_benchmark_thresholds_history.json'
      - 'scripts/ci/check_ai_quantization_codec_contract.py'
      - 'scripts/ci/check_ai_quantization_profile_approvals.py'
      - 'scripts/ci/ai_quantization_profile_approval_keyring.json'
      - 'scripts/ci/ai_quantization_codec_profile.json'
      - 'scripts/ci/ai_quantization_codec_profile_history.json'
      - 'scripts/ci/check_ai_ux_contract.py'
      - 'scripts/ci/ai_direct_backend_attestation_keyring.json'
      - 'scripts/ci/check_ai_cross_lane_evidence.py'
      - 'scripts/ci/check_ai_evidence_manifest.py'
      - 'scripts/ci/ai_evidence_manifest_keyring.json'
      - 'scripts/ci/check_ai_keyring_expiry.py'
      - 'scripts/ci/check_ai_keyring_kms_contract.py'
      - 'scripts/ci/generate_ai_opcode_runtime_report.py'
      - 'experiments/ai/opcodes/PHASE1_BASELINE_HASHES_HISTORY.json'
      - 'scripts/ci/check_ai_tloadhash_toolchain.py'
      - 'scripts/ci/run_governed_llama_flow.py'
      - 'scripts/ci/check_ai_governed_replay_attestation.py'
      - 'scripts/ci/ai_governed_replay_keyring.json'
      - '.github/workflows/ai-experiments-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'experiments/ai/**'
      - 'CMakeLists.txt'
      - 'scripts/test_ai_simple.sh'
      - 'scripts/ci/check_ai_experiment_boundary.py'
      - 'scripts/ci/collect_ai_evidence_bundle.py'
      - 'scripts/ci/check_ai_model_provenance_gate.py'
      - 'scripts/ci/ai_model_provenance_keyring.json'
      - 'scripts/ci/check_ai_policy_event_contract.py'
      - 'scripts/ci/ai_policy_ledger_keyring.json'
      - 'scripts/ci/check_ai_backend_adapter_contract.py'
      - 'scripts/ci/ai_backend_selection_keyring.json'
      - 'scripts/ci/check_ai_vm_trace_evidence.py'
      - 'scripts/ci/check_ai_opcode_subset_contract.py'
      - 'scripts/ci/check_ai_rfc0026_readiness.py'
      - 'scripts/ci/check_ai_opcode_baseline_history_approvals.py'
      - 'scripts/ci/ai_opcode_baseline_approval_keyring.json'
      - 'scripts/ci/check_ai_benchmark_spec_contract.py'
      - 'scripts/ci/check_ai_benchmark_capability_matrix.py'
      - 'scripts/ci/ai_benchmark_capability_expectations.json'
      - 'scripts/ci/check_ai_inference_capability_matrix.py'
      - 'scripts/ci/ai_inference_capability_expectations.json'
      - 'scripts/ci/check_ai_benchmark_threshold_approvals.py'
      - 'scripts/ci/ai_benchmark_threshold_approval_keyring.json'
      - 'scripts/ci/ai_benchmark_thresholds.json'
      - 'scripts/ci/ai_benchmark_thresholds_history.json'
      - 'scripts/ci/check_ai_quantization_codec_contract.py'
      - 'scripts/ci/check_ai_quantization_profile_approvals.py'
      - 'scripts/ci/ai_quantization_profile_approval_keyring.json'
      - 'scripts/ci/ai_quantization_codec_profile.json'
      - 'scripts/ci/ai_quantization_codec_profile_history.json'
      - 'scripts/ci/check_ai_ux_contract.py'
      - 'scripts/ci/ai_direct_backend_attestation_keyring.json'
      - 'scripts/ci/check_ai_cross_lane_evidence.py'
      - 'scripts/ci/check_ai_evidence_manifest.py'
      - 'scripts/ci/ai_evidence_manifest_keyring.json'
      - 'scripts/ci/check_ai_keyring_expiry.py'
      - 'scripts/ci/check_ai_keyring_kms_contract.py'
      - 'scripts/ci/generate_ai_opcode_runtime_report.py'
      - 'experiments/ai/opcodes/PHASE1_BASELINE_HASHES_HISTORY.json'
      - 'scripts/ci/check_ai_tloadhash_toolchain.py'
      - 'scripts/ci/run_governed_llama_flow.py'
      - 'scripts/ci/check_ai_governed_replay_attestation.py'
      - 'scripts/ci/ai_governed_replay_keyring.json'
      - '.github/workflows/ai-experiments-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ai-experiments:
    runs-on: ubuntu-latest
    env:
      T81_AI_EVIDENCE_MANIFEST_KEY_2026Q1: ${{ secrets.T81_AI_EVIDENCE_MANIFEST_KEY_2026Q1 }}
      T81_AI_EVIDENCE_MANIFEST_KEY_2026Q2: ${{ secrets.T81_AI_EVIDENCE_MANIFEST_KEY_2026Q2 }}
      T81_AI_MODEL_PROVENANCE_KEY_2026Q1: ${{ secrets.T81_AI_MODEL_PROVENANCE_KEY_2026Q1 }}
      T81_AI_MODEL_PROVENANCE_KEY_2026Q2: ${{ secrets.T81_AI_MODEL_PROVENANCE_KEY_2026Q2 }}
      T81_AI_POLICY_LEDGER_KEY_2026Q1: ${{ secrets.T81_AI_POLICY_LEDGER_KEY_2026Q1 }}
      T81_AI_POLICY_LEDGER_KEY_2026Q2: ${{ secrets.T81_AI_POLICY_LEDGER_KEY_2026Q2 }}
      T81_AI_BACKEND_SELECTION_KEY_2026Q1: ${{ secrets.T81_AI_BACKEND_SELECTION_KEY_2026Q1 }}
      T81_AI_BACKEND_SELECTION_KEY_2026Q2: ${{ secrets.T81_AI_BACKEND_SELECTION_KEY_2026Q2 }}
      T81_AI_GOVERNED_REPLAY_KEY_2026Q1: ${{ secrets.T81_AI_GOVERNED_REPLAY_KEY_2026Q1 }}
      T81_AI_GOVERNED_REPLAY_KEY_2026Q2: ${{ secrets.T81_AI_GOVERNED_REPLAY_KEY_2026Q2 }}
      T81_AI_DIRECT_BACKEND_KEY_2026Q1: ${{ secrets.T81_AI_DIRECT_BACKEND_KEY_2026Q1 }}
      T81_AI_DIRECT_BACKEND_KEY_2026Q2: ${{ secrets.T81_AI_DIRECT_BACKEND_KEY_2026Q2 }}
      T81_AI_BENCHMARK_APPROVAL_KEY_2026Q1: ${{ secrets.T81_AI_BENCHMARK_APPROVAL_KEY_2026Q1 }}
      T81_AI_BENCHMARK_APPROVAL_KEY_2026Q2: ${{ secrets.T81_AI_BENCHMARK_APPROVAL_KEY_2026Q2 }}
      T81_AI_QUANTIZATION_APPROVAL_KEY_2026Q1: ${{ secrets.T81_AI_QUANTIZATION_APPROVAL_KEY_2026Q1 }}
      T81_AI_QUANTIZATION_APPROVAL_KEY_2026Q2: ${{ secrets.T81_AI_QUANTIZATION_APPROVAL_KEY_2026Q2 }}
      T81_AI_OPCODE_BASELINE_APPROVAL_KEY_2026Q1: ${{ secrets.T81_AI_OPCODE_BASELINE_APPROVAL_KEY_2026Q1 }}
      T81_AI_OPCODE_BASELINE_APPROVAL_KEY_2026Q2: ${{ secrets.T81_AI_OPCODE_BASELINE_APPROVAL_KEY_2026Q2 }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ninja-build
    
    - name: Configure AI Experiments
      run: |
        cmake -S . -B build -G Ninja -DT81_ENABLE_AI_EXPERIMENTS=ON
    
    - name: Build AI CLI
      id: build_ai
      run: |
        if cmake --build build --target help | grep -qE '(^| )t81_ai$'; then
          echo "has_target=true" >> "$GITHUB_OUTPUT"
          cmake --build build --target t81_ai
        else
          echo "has_target=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ target t81_ai is not defined in this configuration; skipping AI build."
          exit 0
        fi

    - name: Build RFC-0025 TLOADHASH conformance targets
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-rfc0025
        if cmake --build build --target help | grep -qE '(^| )t81_vm_tloadhash_conformance_test$'; then
          cmake --build build --target t81_vm_tloadhash_conformance_test
          cmake --build build --target t81_vm_tloadhash_decodefault_determinism_matrix_test
        else
          echo "❌ t81_vm_tloadhash_conformance_test target not found"
          exit 1
        fi

    - name: Run RFC-0025 TLOADHASH conformance tests
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        ctest --test-dir build --output-on-failure --verbose \
          -R 't81_vm_tloadhash_conformance_test|t81_vm_tloadhash_decodefault_determinism_matrix_test' \
          2>&1 | tee build/ai-rfc0025/tloadhash-ctest.log

    - name: Validate RFC-0025 canonize-tensor toolchain baseline
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-rfc0025
        python3 scripts/ci/check_ai_tloadhash_toolchain.py \
          --t81-bin build/t81 \
          --input-file tests/fixtures/llama_cpp_repro/model.gguf \
          --out-dir build/ai-rfc0025

    - name: Configure llama-enabled build (RFC-0025 governed runtime evidence)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        test -f tests/fixtures/llama_cpp_repro/model.gguf
        cmake -S . -B build-llama-ai -G Ninja \
          -DT81_ENABLE_LLAMA_CPP=ON \
          -DT81_BUILD_TESTS=OFF \
          -DT81_BUILD_BENCHMARKS=OFF \
          -DT81_BUILD_FUZZ_TESTS=OFF
        cmake --build build-llama-ai --target t81 --parallel 2

    - name: Run governed llama flow evidence (RFC-0025 required lane)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-governed
        python3 scripts/ci/run_governed_llama_flow.py \
          --t81-bin build-llama-ai/t81 \
          --model tests/fixtures/llama_cpp_repro/model.gguf \
          --prompt "Deterministic governed inference check." \
          --out-dir build/ai-governed \
          --max-tokens 8 \
          --seed 0 \
          --threads 1 \
          --temperature 0 \
          --top-k 1 \
          --top-p 1.0

    - name: Validate governed llama multi-seed replay attestation (RFC-0025 promotion slice)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        python3 scripts/ci/check_ai_governed_replay_attestation.py \
          --t81-bin build-llama-ai/t81 \
          --model tests/fixtures/llama_cpp_repro/model.gguf \
          --prompt "Deterministic governed inference check." \
          --out-dir build/ai-governed \
          --max-tokens 8 \
          --seeds 0,1,2 \
          --replays-per-seed 2 \
          --threads 1 \
          --temperature 0 \
          --top-k 1 \
          --top-p 1.0 \
          --baseline-governed-flow build/ai-governed/governed_llama_flow.json \
          --signing-keyring scripts/ci/ai_governed_replay_keyring.json

    - name: Verify Binary Exists
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        if [ ! -f "build/experiments/ai/ux_tools/t81_ai" ]; then
          echo "❌ AI CLI binary not found"
          exit 1
        fi
        echo "✅ AI CLI binary found"
    
    - name: Run Smoke Tests
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        # Test help command
        ./build/experiments/ai/ux_tools/t81_ai --help
        
        # Test model inspection
        echo "mock model data" > test_model.gguf
        ./build/experiments/ai/ux_tools/t81_ai model inspect test_model.gguf
        
        # Test model verification
        ./build/experiments/ai/ux_tools/t81_ai verify test_model.gguf

        # Test backend capability introspection
        ./build/experiments/ai/ux_tools/t81_ai backend capabilities > /tmp/ai_backend_capabilities.json
        test -s /tmp/ai_backend_capabilities.json
        ./build/experiments/ai/ux_tools/t81_ai backend select --format gguf --mode strict_deterministic > /tmp/ai_backend_selection.json
        test -s /tmp/ai_backend_selection.json

        # Test expanded RFC-00A7 command surface
        ./build/experiments/ai/ux_tools/t81_ai inference run --model test --model-file test_model.gguf --prompt "smoke" > /tmp/ai_inference_run.json
        ./build/experiments/ai/ux_tools/t81_ai quantization inspect --model test --model-file test_model.gguf > /tmp/ai_quantization_inspect.json
        ./build/experiments/ai/ux_tools/t81_ai benchmark run --model test --model-file test_model.gguf > /tmp/ai_benchmark_run.json
        ./build/experiments/ai/ux_tools/t81_ai policy test --event-type model_load --model-file test_model.gguf > /tmp/ai_policy_test.json
        test -s /tmp/ai_inference_run.json
        test -s /tmp/ai_quantization_inspect.json
        test -s /tmp/ai_benchmark_run.json
        test -s /tmp/ai_policy_test.json
        
        # Test error handling
        ! ./build/experiments/ai/ux_tools/t81_ai verify nonexistent.gguf || true
        
        echo "✅ All AI CLI smoke tests passed"
    
    - name: Enforce AI sandbox boundary
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin ${{ github.base_ref }} --depth=1
          python3 scripts/ci/check_ai_experiment_boundary.py --check-pr-diff
        else
          python3 scripts/ci/check_ai_experiment_boundary.py
        fi
    
    - name: Run Official Smoke Test
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        ./scripts/test_ai_simple.sh

    - name: Collect AI deterministic evidence bundle (RFC-00A1 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-evidence
        python3 scripts/ci/collect_ai_evidence_bundle.py \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --out-dir build/ai-evidence \
          --runs 3 \
          --model-fixture tests/fixtures/llama_cpp_repro/model.gguf

    - name: Alert on AI signing key expiry windows
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-keyring
        python3 scripts/ci/check_ai_keyring_expiry.py \
          --keyring scripts/ci/ai_evidence_manifest_keyring.json \
          --keyring scripts/ci/ai_model_provenance_keyring.json \
          --keyring scripts/ci/ai_policy_ledger_keyring.json \
          --keyring scripts/ci/ai_backend_selection_keyring.json \
          --keyring scripts/ci/ai_governed_replay_keyring.json \
          --keyring scripts/ci/ai_direct_backend_attestation_keyring.json \
          --keyring scripts/ci/ai_benchmark_threshold_approval_keyring.json \
          --keyring scripts/ci/ai_quantization_profile_approval_keyring.json \
          --keyring scripts/ci/ai_opcode_baseline_approval_keyring.json \
          --warn-days 30 \
          --fail-days 0 \
          --out-json build/ai-keyring/ai_keyring_expiry_report.json

    - name: Enforce AI keyring KMS metadata contract
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-keyring
        python3 scripts/ci/check_ai_keyring_kms_contract.py \
          --keyring scripts/ci/ai_evidence_manifest_keyring.json \
          --keyring scripts/ci/ai_model_provenance_keyring.json \
          --keyring scripts/ci/ai_policy_ledger_keyring.json \
          --keyring scripts/ci/ai_backend_selection_keyring.json \
          --keyring scripts/ci/ai_governed_replay_keyring.json \
          --keyring scripts/ci/ai_direct_backend_attestation_keyring.json \
          --keyring scripts/ci/ai_benchmark_threshold_approval_keyring.json \
          --keyring scripts/ci/ai_quantization_profile_approval_keyring.json \
          --keyring scripts/ci/ai_opcode_baseline_approval_keyring.json \
          --max-active-days-limit 120 \
          --out-json build/ai-keyring/ai_keyring_kms_contract_report.json

    - name: Enforce model provenance hash gate (RFC-00A3 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-provenance
        python3 scripts/ci/check_ai_model_provenance_gate.py \
          --model build/ai-provenance/test_model.gguf \
          --manifest build/ai-provenance/test_model.manifest.json \
          --signing-keyring scripts/ci/ai_model_provenance_keyring.json \
          --min-lineage-entries 2 \
          --required-lineage-events artifact_ingest,artifact_promotion_candidate \
          --self-test-deny

    - name: Validate AI policy event contract (RFC-00A6 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-policy
        python3 scripts/ci/check_ai_policy_event_contract.py \
          --out-dir build/ai-policy \
          --runtime-trace build/ai-policy/ai_runtime_trace.json \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --ledger-keyring scripts/ci/ai_policy_ledger_keyring.json

    - name: Validate backend adapter contract (RFC-00A5 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-backend
        python3 scripts/ci/check_ai_backend_adapter_contract.py \
          --out-dir build/ai-backend \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --runtime-model build/ai-backend/runtime_backend_probe_model.gguf \
          --policy-contract build/ai-policy/ai_policy_event_contract.json \
          --runtime-trace build/ai-policy/ai_runtime_trace.json \
          --policy-ledger-snapshot build/ai-policy/ai_axion_policy_ledger_snapshot.json \
          --selection-signing-keyring scripts/ci/ai_backend_selection_keyring.json

    - name: Collect VM trace-level evidence (RFC-00A1 runtime trace slice)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-vm-trace
        if cmake --build build --target help | grep -qE '(^| )t81_vm_trace_test$' && \
           cmake --build build --target help | grep -qE '(^| )canonfs_axion_trace_test$'; then
          cmake --build build --target t81_vm_trace_test canonfs_axion_trace_test
          ctest --test-dir build --output-on-failure --verbose \
            -R 't81_vm_trace_test|canonfs_axion_trace_test' \
            2>&1 | tee build/ai-vm-trace/ai_vm_trace_ctest.log
        else
          echo "❌ required VM trace targets not found (t81_vm_trace_test, canonfs_axion_trace_test)"
          exit 1
        fi
        python3 scripts/ci/check_ai_vm_trace_evidence.py \
          --out-dir build/ai-vm-trace \
          --ctest-log build/ai-vm-trace/ai_vm_trace_ctest.log

    - name: Run RFC-0026 phase-1 opcode runtime conformance
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-opcodes
        if cmake --build build --target help | grep -qE '(^| )t81_vm_ai_phase1_qmatmul_conformance_test$'; then
          cmake --build build --target t81_vm_ai_phase1_attention_conformance_test
          cmake --build build --target t81_vm_ai_phase1_embed_conformance_test
          cmake --build build --target t81_vm_ai_phase1_qmatmul_conformance_test
          ctest --test-dir build --output-on-failure --verbose \
            -R 't81_vm_ai_phase1_attention_conformance_test|t81_vm_ai_phase1_embed_conformance_test|t81_vm_ai_phase1_qmatmul_conformance_test' \
            2>&1 | tee build/ai-opcodes/ai_phase1_opcode_ctest.log
        else
          echo "❌ t81_vm_ai_phase1_qmatmul_conformance_test target not found"
          exit 1
        fi

    - name: Generate AI opcode runtime report (RFC-00A8 evidence)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-opcodes-runtime
        python3 scripts/ci/generate_ai_opcode_runtime_report.py \
          --repo-root . \
          --out-dir build/ai-opcodes-runtime \
          --ctest-log build/ai-opcodes/ai_phase1_opcode_ctest.log \
          --baseline-hashes experiments/ai/opcodes/PHASE1_BASELINE_HASHES.json \
          --baseline-hashes-history experiments/ai/opcodes/PHASE1_BASELINE_HASHES_HISTORY.json

    - name: Validate AI opcode subset contract (RFC-0026 / RFC-00A8 runtime-bound)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-opcodes
        python3 scripts/ci/check_ai_opcode_subset_contract.py \
          --out-dir build/ai-opcodes \
          --runtime-report build/ai-opcodes-runtime/ai_opcode_runtime_report.json \
          --ctest-log build/ai-opcodes/ai_phase1_opcode_ctest.log

    - name: Validate AI benchmark runtime thresholds (RFC-00A2 promotion slice)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-benchmark
        python3 scripts/ci/check_ai_benchmark_spec_contract.py \
          --out-dir build/ai-benchmark \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --runtime-model tests/fixtures/llama_cpp_repro/model.gguf \
          --thresholds-file scripts/ci/ai_benchmark_thresholds.json \
          --thresholds-history-file scripts/ci/ai_benchmark_thresholds_history.json \
          --trend-window-count 3

    - name: Emit benchmark format/mode capability matrix (RFC-00A2 runtime visibility)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-benchmark
        python3 scripts/ci/check_ai_benchmark_capability_matrix.py \
          --out-dir build/ai-benchmark \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --model-file tests/fixtures/llama_cpp_repro/model.gguf \
          --formats gguf,t3k \
          --modes strict_deterministic \
          --expectations-file scripts/ci/ai_benchmark_capability_expectations.json \
          --required gguf:strict_deterministic

    - name: Validate benchmark threshold window approvals (RFC-00A2 promotion policy)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-benchmark
        python3 scripts/ci/check_ai_benchmark_threshold_approvals.py \
          --history-file scripts/ci/ai_benchmark_thresholds_history.json \
          --signing-keyring scripts/ci/ai_benchmark_threshold_approval_keyring.json \
          --out-json build/ai-benchmark/ai_benchmark_threshold_approval_report.json

    - name: Emit inference format/mode capability matrix (RFC-00A7 runtime visibility)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-ux
        python3 scripts/ci/check_ai_inference_capability_matrix.py \
          --out-dir build/ai-ux \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --model-file tests/fixtures/llama_cpp_repro/model.gguf \
          --formats gguf,t3k \
          --modes strict_deterministic \
          --expectations-file scripts/ci/ai_inference_capability_expectations.json \
          --required gguf:strict_deterministic

    - name: Track RFC-0026 runtime readiness signals
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-opcodes-runtime
        python3 scripts/ci/check_ai_rfc0026_readiness.py \
          --opcode-report build/ai-opcodes-runtime/ai_opcode_runtime_report.json \
          --benchmark-capability-matrix build/ai-benchmark/ai_benchmark_capability_matrix.json \
          --out-dir build/ai-opcodes-runtime

    - name: Validate opcode baseline history window approvals (RFC-00A8 promotion policy)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-opcodes-runtime
        python3 scripts/ci/check_ai_opcode_baseline_history_approvals.py \
          --history-file experiments/ai/opcodes/PHASE1_BASELINE_HASHES_HISTORY.json \
          --signing-keyring scripts/ci/ai_opcode_baseline_approval_keyring.json \
          --out-json build/ai-opcodes-runtime/ai_opcode_baseline_approval_report.json

    - name: Validate AI quantization runtime fixture corpus (RFC-00A4 promotion slice)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-quantization
        python3 scripts/ci/check_ai_quantization_codec_contract.py \
          --out-dir build/ai-quantization \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --runtime-model tests/fixtures/llama_cpp_repro/model.gguf \
          --codec-profile-file scripts/ci/ai_quantization_codec_profile.json \
          --codec-profile-history-file scripts/ci/ai_quantization_codec_profile_history.json \
          --trend-window-count 3

    - name: Validate quantization profile window approvals (RFC-00A4 promotion policy)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-quantization
        python3 scripts/ci/check_ai_quantization_profile_approvals.py \
          --history-file scripts/ci/ai_quantization_codec_profile_history.json \
          --signing-keyring scripts/ci/ai_quantization_profile_approval_keyring.json \
          --out-json build/ai-quantization/ai_quantization_profile_approval_report.json

    - name: Validate AI UX contract (RFC-00A7 baseline)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-ux
        python3 scripts/ci/check_ai_ux_contract.py \
          --ai-bin build/experiments/ai/ux_tools/t81_ai \
          --out-dir build/ai-ux \
          --runtime-model tests/fixtures/llama_cpp_repro/model.gguf \
          --t81-bin build-llama-ai/t81 \
          --llama-hash-probe scripts/ci/llama_model_hash.py \
          --direct-backend-signing-keyring scripts/ci/ai_direct_backend_attestation_keyring.json

    - name: Validate AI cross-lane evidence lock (RFC-00A1 promotion slice)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-cross-lane
        cmd=(
          python3 scripts/ci/check_ai_cross_lane_evidence.py
          --out-dir build/ai-cross-lane
          --evidence-bundle build/ai-evidence/ai_evidence_bundle.json
          --ux-contract build/ai-ux/ai_ux_contract.json
          --ux-inference build/ai-ux/ai_inference_run.json
          --ux-quantization build/ai-ux/ai_quantization_inspect.json
          --ux-benchmark build/ai-ux/ai_benchmark_run.json
          --tloadhash-toolchain build/ai-rfc0025/ai_tloadhash_toolchain.json
        )
        if [ -f "build/ai-governed/governed_llama_flow.json" ]; then
          cmd+=(--governed-flow build/ai-governed/governed_llama_flow.json)
        fi
        "${cmd[@]}"

    - name: Build AI signed multi-lane evidence manifest (RFC-00A1 promotion slice)
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        mkdir -p build/ai-manifest
        cmd=(
          python3 scripts/ci/check_ai_evidence_manifest.py
          --out-dir build/ai-manifest
          --evidence-bundle build/ai-evidence/ai_evidence_bundle.json
          --vm-trace build/ai-vm-trace/ai_vm_trace_evidence.json
          --cross-lane build/ai-cross-lane/ai_cross_lane_evidence.json
          --backend-contract build/ai-backend/ai_backend_adapter_contract.json
          --ux-contract build/ai-ux/ai_ux_contract.json
          --tloadhash-toolchain build/ai-rfc0025/ai_tloadhash_toolchain.json
          --signing-keyring scripts/ci/ai_evidence_manifest_keyring.json
          --promotion-window-start 2026-03-01
          --promotion-window-end 2026-03-31
        )
        if [ -f "build/ai-governed/governed_llama_flow.json" ]; then
          cmd+=(--governed-flow build/ai-governed/governed_llama_flow.json)
        fi
        "${cmd[@]}"

    - name: Append AI evidence summary
      if: steps.build_ai.outputs.has_target == 'true'
      run: |
        cat build/ai-evidence/ai_evidence_summary.md >> "$GITHUB_STEP_SUMMARY"
        {
          echo "# AI Keyring Expiry Alert"
          echo ""
          echo "- report: \`build/ai-keyring/ai_keyring_expiry_report.json\`"
          echo "- warning threshold: \`30\` days"
          echo "- fail threshold: \`0\` days (already expired)"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        {
          echo "# AI Keyring KMS Contract"
          echo ""
          echo "- report: \`build/ai-keyring/ai_keyring_kms_contract_report.json\`"
          echo "- max_active_days_limit: \`120\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-vm-trace/ai_vm_trace_evidence.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-policy/ai_policy_event_contract.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-policy/ai_axion_policy_ledger_snapshot.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-policy/ai_axion_policy_ledger_replay_verification.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-backend/ai_backend_adapter_contract.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-backend/runtime_backend_selection_manifest.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-opcodes/ai_opcode_subset_contract.md >> "$GITHUB_STEP_SUMMARY"
        {
          echo "# RFC-0026 Phase-1 Opcode Conformance"
          echo ""
          echo "- ctest regex: \`t81_vm_ai_phase1_attention_conformance_test|t81_vm_ai_phase1_embed_conformance_test|t81_vm_ai_phase1_qmatmul_conformance_test\`"
          echo "- log: \`build/ai-opcodes/ai_phase1_opcode_ctest.log\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-opcodes-runtime/ai_opcode_runtime_report.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-opcodes-runtime/ai_rfc0026_readiness.md >> "$GITHUB_STEP_SUMMARY"
        {
          echo "# RFC-00A8 Baseline Approval Policy"
          echo ""
          echo "- report: \`build/ai-opcodes-runtime/ai_opcode_baseline_approval_report.json\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-benchmark/ai_benchmark_spec_contract.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-benchmark/ai_benchmark_capability_matrix.md >> "$GITHUB_STEP_SUMMARY"
        {
          echo "# RFC-00A2 Threshold Approval Policy"
          echo ""
          echo "- report: \`build/ai-benchmark/ai_benchmark_threshold_approval_report.json\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-quantization/ai_quantization_codec_contract.md >> "$GITHUB_STEP_SUMMARY"
        {
          echo "# RFC-00A4 Profile Approval Policy"
          echo ""
          echo "- report: \`build/ai-quantization/ai_quantization_profile_approval_report.json\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-ux/ai_inference_capability_matrix.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-ux/ai_ux_contract.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-ux/ai_direct_backend_execution_attestation.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-cross-lane/ai_cross_lane_evidence.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-manifest/ai_evidence_manifest.md >> "$GITHUB_STEP_SUMMARY"
        {
          echo "# RFC-0025 TLOADHASH Conformance"
          echo ""
          echo "- ctest regex: \`t81_vm_tloadhash_conformance_test|t81_vm_tloadhash_decodefault_determinism_matrix_test\`"
          echo "- log: \`build/ai-rfc0025/tloadhash-ctest.log\`"
          echo "- toolchain artifact: \`build/ai-rfc0025/ai_tloadhash_toolchain.json\`"
          echo "- governed runtime artifact (required lane): \`build/ai-governed/governed_llama_flow.json\`"
          echo "- governed replay attestation artifact: \`build/ai-governed/governed_llama_replay_attestation.json\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-rfc0025/ai_tloadhash_toolchain.md >> "$GITHUB_STEP_SUMMARY"
        cat build/ai-governed/governed_llama_replay_attestation.md >> "$GITHUB_STEP_SUMMARY"

