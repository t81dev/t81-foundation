      - name: Download arm64 T81Lang hash
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: t81lang-hash-linux-arm64-clang
          path: hashes/arm64

      - name: Compare cross-arch hashes
        shell: bash
        run: |
          set -euo pipefail
          x86_hash="$(tr -d ' \n\r' < hashes/x86_64/hash.txt)"
          arm_hash="$(tr -d ' \n\r' < hashes/arm64/hash.txt)"
          echo "x86_64 hash: ${x86_hash}"
          echo "arm64  hash: ${arm_hash}"
          if [ -z "${x86_hash}" ] || [ -z "${arm_hash}" ]; then
            echo "::error::missing one or both hash values"
            exit 1
          fi
          if [ "${x86_hash}" != "${arm_hash}" ]; then
            echo "::error::cross-arch bit identity failed"
            exit 1
          fi
          echo "Cross-arch bit identity passed."
          {
            echo "### T81Lang Cross-Arch Hash Check"
            echo "- x86_64: \`${x86_hash}\`"
            echo "- arm64: \`${arm_hash}\`"
            echo "- verdict: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  ############################################################################
  # JOB: benchmarks
  ############################################################################
  benchmarks:
    name: " benchmark / linux-x86_64 "
    needs: spec-and-docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build jq

      - name: Configure benchmark build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DT81_BUILD_BENCHMARKS=ON \
            -DT81_BUILD_TESTS=OFF

      - name: Build benchmark runner
        run: cmake --build build --parallel --target benchmark_runner

      - name: Run benchmark runner
        run: |
          mkdir -p .github/logs
          ./build/benchmarks/benchmark_runner --benchmark_format=json --benchmark_out=bench.json 2>&1 | tee .github/logs/benchmark.log

      - name: Enforce SIMD benchmark non-regression thresholds
        run: |
          python3 scripts/ci/check_simd_regression.py bench.json 2>&1 | tee -a .github/logs/benchmark.log

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ci-benchmarks-linux-x86_64
          path: |
            bench.json
            docs/reference/benchmarks.md
            .github/logs/benchmark.log
          if-no-files-found: warn

  ############################################################################
  # JOB: static-analysis
  ############################################################################
  static-analysis:
    name: " static analysis / clang-tidy "
    needs: spec-and-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-tidy-18 build-essential cmake ninja-build libasio-dev pybind11-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DT81_BUILD_TESTS=OFF \
            -DT81_BUILD_EXAMPLES=OFF \
            -DT81_BUILD_BENCHMARKS=OFF \
            -DT81_BUILD_FUZZ_TESTS=OFF

      - name: Run clang-tidy
        run: |
          python3 - <<'PY' > /tmp/clang_tidy_files.txt
          import json
          from pathlib import Path

          root = Path.cwd().resolve()
          with open(root / "build" / "compile_commands.json", "r", encoding="utf-8") as fh:
              compile_db = json.load(fh)

          source_files = []
          for entry in compile_db:
              file_path = Path(entry["file"]).resolve()
              try:
                  rel = file_path.relative_to(root)
              except ValueError:
                  continue
              if rel.suffix in {".cpp", ".cc", ".cxx"} and rel.parts and rel.parts[0] in {
                  "src", "core", "kernel", "runtime", "lang"
              }:
                  source_files.append(str(rel))

          for path in sorted(set(source_files)):
              print(path)
          PY
          test -s /tmp/clang_tidy_files.txt
          xargs -a /tmp/clang_tidy_files.txt clang-tidy-18 -p build \
            --header-filter='^.*/(include/t81|core|kernel|runtime|lang)/.*' \
            --checks='-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*,clang-analyzer-deadcode.*,clang-analyzer-security.*,clang-analyzer-unix.*' \

  ############################################################################
  # JOB: sanitizers
  ############################################################################
  sanitizers:
    name: " build / sanitizers "
    needs: spec-and-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build clang-18

      - name: Configure and Build (ASan/UBSan)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DT81_ENABLE_ASAN=ON \
            -DT81_ENABLE_UBSAN=ON
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

  ############################################################################
  # JOB: fuzzing
  ############################################################################
  fuzzing:
    name: " fuzzing / frontend "
    needs: spec-and-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build clang-18

      - name: Configure and Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=Release \
            -DT81_BUILD_FUZZ_TESTS=ON
          cmake --build build --target t81_frontend_fuzz_test

      - name: Run Fuzzer
        run: |
          ./build/t81_frontend_fuzz_test -max_total_time=60

  ############################################################################
  # JOB: formal-verification
  ############################################################################
  formal-verification:
    name: " formal verification / ternary logic "
    needs: spec-and-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build gcc-14 g++-14

      - name: Configure and Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14

      - name: Build t81 CLI
        run: |
          cmake --build build --parallel --target t81

      - name: Run Ternary Logic Verification
        run: |
          python3 scripts/verify_ternary_logic.py

  ############################################################################
  # JOB: tritwise-determinism
  ############################################################################
  tritwise-determinism:
    name: " gate / tritwise-determinism / ${{ matrix.config.name }}"
    needs: spec-and-docs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "avx2-asan"
            cmake_args: "-DCMAKE_BUILD_TYPE=Debug -DT81_BUILD_BENCHMARKS=ON -DT81_BUILD_TESTS=ON -DT81_ENABLE_ASAN=ON -DT81_ENABLE_UBSAN=ON -DCMAKE_CXX_FLAGS=\"-mavx2 -mfma\""
            build_targets: "t81_tritwise_backend_equivalence_test benchmark_runner"
            run_cmd: "./build/t81_tritwise_backend_equivalence_test"
            smoke_cmd: "./build/benchmarks/benchmark_runner --benchmark_filter=\"BM_MaskApply_Library/256\" --benchmark_min_time=0.01"
          - name: "no-simd"
            cmake_args: "-DCMAKE_BUILD_TYPE=Debug -DT81_BUILD_TESTS=ON"
            build_targets: "t81_tritwise_backend_equivalence_test"
            run_cmd: "./build/t81_tritwise_backend_equivalence_test"
            smoke_cmd: "echo 'No smoke test for no-simd'"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build python3

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja ${{ matrix.config.cmake_args }}

      - name: Build
        run: cmake --build build --target ${{ matrix.config.build_targets }} --parallel

      - name: Run Equivalence Tests
        run: ${{ matrix.config.run_cmd }}

      - name: Run Benchmark Smoke Test
        if: matrix.config.name == 'avx2-asan'
        run: ${{ matrix.config.smoke_cmd }}

  ############################################################################
  # JOB: quality-gate
  ############################################################################
  quality-gate:
    name: " quality gate / required "
    runs-on: ubuntu-latest
    needs:
      - spec-and-docs
      - determinism-slice
      - build-and-test
      - cxx-standard-compat
      - static-analysis
      - sanitizers
      - fuzzing
      - formal-verification
      - benchmarks
      - tritwise-determinism
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        shell: bash
        run: |
          if [[ "${{ needs.spec-and-docs.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.determinism-slice.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.cxx-standard-compat.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.static-analysis.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizers.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.fuzzing.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.formal-verification.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.benchmarks.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.tritwise-determinism.result }}" != "success" ]]; then exit 1; fi
          echo "All required CI quality gates passed."
