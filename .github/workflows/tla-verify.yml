name: TLA+ Formal Verification (TernaryOS Transactions)

on:
  pull_request:
    paths:
      - 'spec/formal/**'
      - 'kernel/**'
      - 'runtime/**'
      - 'tools/cli/core/mcp_server.cpp'
      - '.github/workflows/tla-verify.yml'
  push:
    branches: [main]
    paths:
      - 'spec/formal/**'
      - 'kernel/**'
      - 'runtime/**'
      - 'tools/cli/core/mcp_server.cpp'
      - '.github/workflows/tla-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc-model-check:
    name: "formal / tlc / TernaryOSTransactions"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Temurin Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download TLA+ tools (v1.8.0)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      - name: Run TLC model checker on TernaryOSTransactions.tla
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -workers auto \
            -cleanup \
            -config spec/formal/TernaryOSTransactions.cfg \
            spec/formal/TernaryOSTransactions.tla
