# .github/workflows/bench.yml
name: T81 Speed Oracle

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bench
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.os }} • ${{ matrix.arch || 'native' }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - os: ubuntu
            runs_on: ubuntu-24.04
            arch: zen4
            cxx_flags: -O3 -mtune=znver4 -DNDEBUG
          - os: ubuntu
            runs_on: ubuntu-24.04
            arch: native
            cxx_flags: -O3 -march=native -DNDEBUG
          - os: macos
            runs_on: macos-14
            arch: apple-m2
            cxx_flags: -O3 -DNDEBUG

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y ninja-build
          fi

      - name: Configure CMake
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DT81_BENCHMARK=ON
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"

      - name: Build benchmark runner
        run: cmake --build build --target benchmark_runner --parallel

      - name: Run benchmarks
        run: ./build/benchmarks/benchmark_runner --benchmark_format=json --benchmark_out=bench.json

      - name: Enforce VM workload benchmark guardrail
        run: python3 scripts/ci/check_vm_workload_benchmark_regression.py bench.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: speed-oracle-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            bench.json
            .github/badges/t81-speed.json
          if-no-files-found: warn

      - name: Generate live badge
        run: |
          mkdir -p .github/badges
          # Extract key metric (example: fastest matmul in ns)
          BEST=$(jq -r '.benchmarks[] | select(.name | contains("MatMul/4096")) | .real_time' bench.json | sort -n | head -1)
          PERF=$(echo "scale=1; 1000000 / $BEST" | bc -l 2>/dev/null || echo "∞")
          
          COLOR="red"
          if [[ "$PERF" == "∞" ]]; then
            COLOR="brightgreen"
          else
            awk "BEGIN { exit !($PERF > 10) }" && COLOR="orange"
            awk "BEGIN { exit !($PERF > 25) }" && COLOR="yellow"
            awk "BEGIN { exit !($PERF > 50) }" && COLOR="green"
            awk "BEGIN { exit !($PERF > 100) }" && COLOR="brightgreen"
          fi

          cat > .github/badges/t81-speed.json <<EOF
          {
            "schemaVersion": 1,
            "label": "T81 Speed",
            "message": "${PERF} Gops/s",
            "color": "$COLOR",
            "style": "for-the-badge"
          }
          EOF

      - name: Update README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          start = "<!-- T81-SPEED-START -->"
          end = "<!-- T81-SPEED-END -->"
          replacement = """<!-- T81-SPEED-START -->

          ![T81 Speed Oracle](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Ft81dev%2Ft81-foundation%2Fmain%2F.github%2Fbadges%2Ft81-speed.json&style=for-the-badge)

          <!-- T81-SPEED-END -->"""
          if start in text and end in text:
            before, rest = text.split(start, 1)
            _, after = rest.split(end, 1)
            p.write_text(before + replacement + after, encoding="utf-8")
          PY

      - name: Create Pull Request with benchmark updates
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/bench-speed-oracle
          delete-branch: true
          title: "chore(bench): refresh speed oracle badge"
          body: "Automated benchmark badge/README refresh from `benchmark_runner`."
          commit-message: "chore(bench): refresh speed oracle badge [ci skip]"
          labels: benchmarks,automated
