name: QEMU Boot (x86_64)

on:
  push:
    branches: [main]
    paths:
      - 'userland/experimental/hal/qemu_x86_64_efi_stub.c'
      - 'userland/experimental/hal/qemu_x86_64_bare_kernel.c'
      - 'userland/experimental/hal/qemu_x86_64_cpp_bridge.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/qemu-boot-x86.yml'
  pull_request:
    paths:
      - 'userland/experimental/hal/qemu_x86_64_*.c'
      - 'userland/experimental/hal/qemu_x86_64_*.cpp'
      - '.github/workflows/qemu-boot-x86.yml'
  workflow_dispatch:

jobs:
  boot-x86:
    name: Build BOOTX64.EFI and validate OVMF boot
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-18 lld-18 \
            qemu-system-x86 ovmf \
            mtools parted \
            cmake ninja-build

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DT81_ENABLE_TERNARYOS=ON \
            -DT81_BUILD_TESTS=OFF \
            -DT81_BUILD_EXAMPLES=OFF \
            -DT81_BUILD_BENCHMARKS=OFF \
            -DT81_BUILD_FUZZ_TESTS=OFF \
            -DT81_LLVM_CLANG=$(which clang-18) \
            -DT81_LLD_LINK=$(which lld-link-18) \
            -Wno-dev

      - name: Build BOOTX64.EFI
        run: cmake --build build --target t81_ternaryos_qemu_x86_64_efi -j$(nproc)

      - name: Assemble FAT32 GPT disk image
        run: |
          EFI=build/ternaryos/qemu_x86_64/BOOTX64.EFI
          IMG=build/qemu_x86_64_boot.img
          OFFSET=1048576

          dd if=/dev/zero of="$IMG" bs=1M count=64 status=none
          parted -s "$IMG" mklabel gpt
          parted -s "$IMG" mkpart EFI fat32 1MiB 63MiB
          parted -s "$IMG" set 1 esp on

          mformat -i "${IMG}@@${OFFSET}" -F -v AXIONX64 ::
          mmd    -i "${IMG}@@${OFFSET}" ::/EFI ::/EFI/BOOT
          mcopy  -i "${IMG}@@${OFFSET}" "$EFI" ::/EFI/BOOT/BOOTX64.EFI

      - name: Create and format CanonFS raw block store image
        run: |
          # 4 MiB zero-filled raw disk — presented as virtio-blk-pci on q35.
          # The freestanding bridge detects it via PCI config-space scan (≥2
          # virtio-blk devices → boot disk + CanonFS store).
          dd if=/dev/zero of=build/canon_store_x86.img bs=1M count=4 status=none

          # Write a valid CanonFS superblock at byte offset 0 (729-byte block,
          # matching CanonStore LBA 0 layout in src/canonfs and canon_store.cpp).
          python3 - <<'PYEOF'
          import struct, sys
          magic          = b'CST1'
          entry_count    = struct.pack('<I', 0)
          entries        = bytes(17 * 40)          # 680 bytes — no objects
          overflow_count = struct.pack('<Q', 0)
          padding        = bytes(33)
          superblock     = magic + entry_count + entries + overflow_count + padding
          assert len(superblock) == 729, f"superblock is {len(superblock)} bytes, expected 729"
          with open('build/canon_store_x86.img', 'r+b') as f:
              f.write(superblock)
          print(f"CanonFS superblock written ({len(superblock)} bytes, magic=CST1, 0 entries)")
          PYEOF

      - name: Verify CanonFS superblock (x86)
        run: |
          python3 - <<'PYEOF'
          import sys
          with open('build/canon_store_x86.img', 'rb') as f:
              magic = f.read(4)
          if magic == b'CST1':
              print('PASS: CanonFS x86 superblock CST1 magic verified')
          else:
              print(f'FAIL: expected CST1, got {magic!r}', file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Boot under QEMU (OVMF x86_64)
        run: |
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
          OVMF_VARS=$(mktemp --suffix=.fd)
          cp /usr/share/OVMF/OVMF_VARS.fd "$OVMF_VARS"

          timeout 40 qemu-system-x86_64 \
            -machine q35 \
            -cpu qemu64 \
            -m 512M \
            -nographic \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$OVMF_VARS" \
            -drive if=virtio,format=raw,file=build/qemu_x86_64_boot.img \
            -drive if=virtio,format=raw,file=build/canon_store_x86.img \
            -serial file:serial_x86.log \
            2>/dev/null || true

          rm -f "$OVMF_VARS"

      - name: Validate boot output
        run: |
          echo "=== serial_x86.log ==="
          cat serial_x86.log || echo "(empty)"

          check() {
            grep -qF "$1" serial_x86.log \
              && echo "PASS: $1" \
              || { echo "FAIL: $1"; exit 1; }
          }

          check "Axion QEMU x86_64 OVMF slice6"
          check "[axion] bare-metal x86_64 entry"
          check "[axion] ExitBootServices complete"
          check "[axion] canonfs: mounted (persistent, virtio-blk)"
          check "[axion] canonfs: I/O probe OK"
          check "[axion] event loop: priority dispatch"
          check "[axion] t81sh: ready (principal=axion, tier=1)"
          # LAPIC is the preferred path on q35; PIT banner is accepted as fallback.
          if grep -qF "[axion] hw timer: LAPIC 100Hz armed (IDT 0x40)" serial_x86.log 2>/dev/null; then
            echo "PASS: [axion] hw timer: LAPIC 100Hz armed (IDT 0x40)"
          elif grep -qF "[axion] hw timer: PIT ch0 100Hz armed (IDT 0x20)" serial_x86.log 2>/dev/null; then
            echo "PASS: hw timer (PIT fallback)"
          else
            echo "FAIL: no hw timer banner found"; exit 1
          fi

      - name: Save boot log
        run: cp serial_x86.log drivers/qemu/sample-boot-log-x86.txt

      - name: Commit boot log
        uses: EndBug/add-and-commit@v9
        with:
          add: 'drivers/qemu/sample-boot-log-x86.txt'
          message: 'ci(qemu-x86): update sample x86_64 boot log [skip ci]'
          default_author: github_actions

      - name: Upload serial log artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-x86-serial-log
          path: serial_x86.log
          retention-days: 30
