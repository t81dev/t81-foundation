# .github/workflows/avx2-membound-bench.yml
#
# Native x86-64 AVX2 Memory-Bound Dual-Rail Calibration (BM_MemBound64_*)
#
# Manually triggered (workflow_dispatch) on ubuntu-24.04 (native x86_64) to
# compile benchmark_runner with `-O3 -march=native` so `__x86_64__ && __AVX2__`
# kernels in benchmarks/BM_DualRailMemoryBound.cpp are actively executed and
# exported as structured JSON alongside host CPU metadata.

name: Native x86-64 AVX2 MemBound Benchmark

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Benchmark preset (default_l64 or dram_sweep_gt480mib)"
        required: false
        type: choice
        default: "default_l64"
        options:
          - "default_l64"
          - "dram_sweep_gt480mib"
      benchmark_filter:
        description: "Optional Google Benchmark filter regex (overrides preset)"
        required: false
        default: ""
      benchmark_min_time:
        description: "Minimum time per benchmark case"
        required: false
        default: "0.2s"

permissions:
  contents: read

jobs:
  avx2-membound-bench:
    name: "bench / native-x86_64-avx2 / ubuntu-24.04"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Verify native x86_64 hardware and AVX2 support
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          echo "uname -m: ${ARCH}"
          test "${ARCH}" = "x86_64"
          grep -m1 -E "model name" /proc/cpuinfo || true
          grep -m1 -w "avx2" /proc/cpuinfo > /dev/null
          echo "AVX2_VERIFIED=1"
          mkdir -p build/avx2-artifacts
          {
            echo "uname: $(uname -a)"
            grep -m1 -E "model name" /proc/cpuinfo || true
            lscpu || true
            echo "=== MEMORY ==="
            free -h || true
            grep -E "MemTotal|MemAvailable|SwapTotal" /proc/meminfo || true
          } > build/avx2-artifacts/host_cpu.txt
          AVAIL_MIB="$(awk '/MemAvailable:/ {printf "%d", $2/1024}' /proc/meminfo)"
          echo "Available RAM: ${AVAIL_MIB} MiB"
          if [ "${{ github.event.inputs.preset || 'default_l64' }}" = "dram_sweep_gt480mib" ]; then
            test "${AVAIL_MIB}" -ge 4096
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure and build benchmark_runner with -O3 -march=native
        env:
          T81_BENCH_CXX_FLAGS: "-O3 -march=native -DNDEBUG"
        run: bash scripts/ci/build_benchmark_runner.sh

      - name: Run native x86_64 AVX2 MemBound benchmarks
        run: |
          set -euo pipefail
          PRESET="${{ github.event.inputs.preset || 'default_l64' }}"
          CUSTOM_FILTER="${{ github.event.inputs.benchmark_filter || '' }}"
          if [ -n "${CUSTOM_FILTER}" ]; then
            FILTER="${CUSTOM_FILTER}"
          elif [ "${PRESET}" = "dram_sweep_gt480mib" ]; then
            FILTER="BM_MemBoundDramSweep_(DualRail_Dense|SBDR128_SIMD|INT8_Sparse128)"
          else
            FILTER="BM_MemBound64_(DualRail_Dense|SBDR128_SIMD|INT8_Sparse128)"
          fi
          echo "Running benchmark_filter=${FILTER}"
          ./build/benchmarks/benchmark_runner \
            --benchmark_filter="${FILTER}" \
            --benchmark_min_time="${{ github.event.inputs.benchmark_min_time || '0.2s' }}" \
            --benchmark_format=json \
            --benchmark_out=build/avx2-artifacts/avx2_membound.json
          cat build/avx2-artifacts/avx2_membound.json

      - name: Run H06-MEM-04 multi-batch regime benchmark & regression gate
        run: |
          set -euo pipefail
          cmake --build build --target t81_bench_h06_mem_04 -j "$(nproc)"
          ./build/benchmarks/t81_bench_h06_mem_04 \
            --manifest benchmarks/h06_mem_04/manifests/xeon_6975p_avx2.json \
            --output build/avx2-artifacts/h06_mem_04_xeon.json \
            --smoke
          python3 scripts/eval_h06_mem_04.py \
            --results build/avx2-artifacts/h06_mem_04_xeon.json \
            --markdown-out build/avx2-artifacts/h06_mem_04_xeon.md
          cat build/avx2-artifacts/h06_mem_04_xeon.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload native x86_64 AVX2 JSON artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avx2-membound-bench-json
          path: |
            build/avx2-artifacts/avx2_membound.json
            build/avx2-artifacts/host_cpu.txt
            build/avx2-artifacts/h06_mem_04_xeon.json
            build/avx2-artifacts/h06_mem_04_xeon.md
          if-no-files-found: error
