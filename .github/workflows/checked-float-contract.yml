name: BASE-01 independent Windows Debug ISA correctness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isa-debug:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 35f73ac9751423f9ac083c7f4b84def34d810443
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Correctness target only
        run: python control/scripts/ci/base01_independent_isa_debug.py
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: base01-independent-windows-Debug-isa
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/CMakeCache.txt
          retention-days: 90
