name: CanonFS and VM isolated correctness repairs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout validation controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: control
          persist-credentials: false
      - name: Checkout exact PR source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ca97b9cbdc2c76a6ab5b830a2eb4df0ceae5566c
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Linux compiler prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-14 g++-14 ninja-build
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Linux correctness only
        if: runner.os == 'Linux'
        run: python control/scripts/ci/base01_portability_check.py --source source --expected-source ca97b9cbdc2c76a6ab5b830a2eb4df0ceae5566c --system Linux --config ${{ matrix.config }} --cc gcc-14 --cxx g++-14 --output evidence
      - name: Windows correctness only
        if: runner.os == 'Windows'
        run: python control/scripts/ci/base01_portability_check.py --source source --expected-source ca97b9cbdc2c76a6ab5b830a2eb4df0ceae5566c --system Windows --config ${{ matrix.config }} --cc cl --cxx cl --output evidence
      - name: Publish raw records including failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: base01-${{ matrix.os }}-${{ matrix.config }}
          path: |
            evidence/*.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*CMakeCache.txt
            evidence/mutants/*.cpp
            evidence/mutants/CMakeLists.txt
            evidence/diagnostics/*.cpp
            evidence/diagnostics/CMakeLists.txt
          retention-days: 90
